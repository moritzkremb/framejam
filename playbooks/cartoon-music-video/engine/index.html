<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>music video engine</title>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("/assets/fonts/Archivo-VF.ttf");
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: "Archivo Black";
        src: url("/assets/fonts/ArchivoBlack.ttf");
      }
      @font-face {
        font-family: "Anton";
        src: url("/assets/fonts/Anton.ttf");
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/assets/fonts/JetBrainsMono-VF.ttf");
        font-weight: 100 800;
      }
      @font-face {
        font-family: "Doto";
        src: url("/assets/fonts/Doto-VF.ttf");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Black Han Sans";
        src: url("/assets/fonts/BlackHanSans.ttf");
      }
      @font-face {
        font-family: "Unbounded";
        src: url("/assets/fonts/Unbounded-VF.ttf");
        font-weight: 200 900;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("/assets/fonts/InstrumentSerif.ttf");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("/assets/fonts/InstrumentSerif-Italic.ttf");
      }
      @font-face {
        font-family: "Geist";
        src: url("/assets/fonts/geist-latin-wght-normal.woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("/assets/fonts/geist-mono-latin-wght-normal.woff2");
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      canvas#c {
        display: block;
      }
      #fontwarm {
        position: absolute;
        left: -9999px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "opentype.js": "/node_modules/opentype.js/dist/opentype.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="fontwarm">
      <span style="font-family: Archivo; font-weight: 900">a</span
      ><span style="font-family: &quot;Archivo Black&quot;">a</span
      ><span style="font-family: Anton">a</span>
      <span style="font-family: &quot;JetBrains Mono&quot;">a</span
      ><span style="font-family: Doto; font-weight: 900">a</span
      ><span style="font-family: &quot;Black Han Sans&quot;">가</span>
      <span style="font-family: Unbounded; font-weight: 900">a</span
      ><span
        style="font-family: &quot;Instrument Serif&quot;; font-style: italic"
        >a</span
      >
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/engine/main.js"></script>
  </body>
</html>
