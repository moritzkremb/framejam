<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
        @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", sans-serif; color: #f4f4f5; }
        #build-bg { position: absolute; inset: 0; background: #0c0c0d; }
        #build-glow { position: absolute; left: 260px; top: 180px; width: 1400px; height: 1100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(124, 196, 255, 0.14), rgba(124, 196, 255, 0) 70%); }
        #build-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

        #build-win { position: absolute; left: 100px; top: 290px; width: 1720px; height: 710px; border-radius: 18px; overflow: hidden; background: #141416; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.1), 0 50px 140px rgba(0, 0, 0, 0.7); transform-origin: 50% 60%; }
        #build-bar { position: absolute; left: 0; top: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 9px; padding-left: 18px; background: #1a1a1d; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .build-dot { width: 13px; height: 13px; border-radius: 50%; background: #3a3a40; }
        #build-title { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; color: #8a8a93; letter-spacing: -0.01em; }

        #build-chat { position: absolute; left: 0; top: 44px; bottom: 0; width: 1720px; }
        #build-thread { position: absolute; left: 34px; right: 34px; top: 34px; display: flex; flex-direction: column; gap: 18px; }
        #build-ask { align-self: flex-end; max-width: 560px; padding: 16px 22px; border-radius: 16px; background: #26262b; font-size: 24px; line-height: 1.3; letter-spacing: -0.01em; }
        .build-row { display: flex; align-items: center; gap: 14px; font-family: "Geist Mono", monospace; font-size: 21px; color: #a1a1aa; }
        .build-tick { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(124, 196, 255, 0.14); color: #7cc4ff; font-size: 16px; }
        #build-row3 { color: #f4f4f5; }
        #build-row3 .build-tick { background: rgba(212, 255, 58, 0.16); color: #d4ff3a; }

        #build-box { position: absolute; left: 34px; right: 34px; bottom: 30px; height: 132px; border-radius: 16px; background: #1c1c20; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.09); }
        #build-typed { position: absolute; left: 24px; top: 20px; right: 24px; font-size: 27px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; }
        .build-ch { display: none; }
        .build-cmd { color: #7cc4ff; }
        #build-caret { display: inline-block; width: 2px; height: 30px; margin-left: 2px; vertical-align: -5px; background: #f4f4f5; }
        #build-hint { position: absolute; left: 24px; top: 21px; font-size: 27px; color: #5c5c64; }
        #build-chip { position: absolute; left: 22px; bottom: 16px; padding: 6px 14px; border-radius: 999px; background: #26262b; font-size: 17px; color: #a1a1aa; }
        #build-send { position: absolute; right: 18px; bottom: 14px; width: 38px; height: 38px; border-radius: 50%; background: #f4f4f5; color: #0c0c0d; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }

        #build-panel { position: absolute; right: 17px; top: 61px; width: 1010px; height: 631px; border-radius: 10px; overflow: hidden; background: #0c0c0d; box-shadow: 0 0 0 1.5px rgba(212, 255, 58, 0.4); }
        #build-panel video, #build-panel img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

        .build-cap { position: absolute; left: 50%; top: 100px; padding: 28px 46px 36px; border-radius: 30px; background: rgba(12, 12, 13, 0.94); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.35); font-weight: 700; font-size: 96px; line-height: 1.02; letter-spacing: -0.04em; white-space: nowrap; transform-origin: 50% 0; }
        .build-w { display: inline-block; }
        .build-blue { color: #7cc4ff; }
      </style>

      <div id="root" data-composition-id="build" data-width="1920" data-height="1080">
        <div id="build-bg" class="clip" data-start="0" data-duration="5.2" data-track-index="0"></div>
        <div id="build-glow" class="clip" data-start="0" data-duration="5.2" data-track-index="1"></div>
        <div id="build-stage">
          <div id="build-win">
            <div id="build-bar"><span class="build-dot"></span><span class="build-dot"></span><span class="build-dot"></span><span id="build-title">launch-teaser</span></div>
            <div id="build-chat">
              <div id="build-thread">
                <div id="build-ask"><span class="build-cmd">/framejam</span> make a launch teaser for our app</div>
                <div id="build-row1" class="build-row"><span class="build-tick">✓</span>Wrote the composition</div>
                <div id="build-row2" class="build-row"><span class="build-tick">✓</span>Rendered v1 · 0:08</div>
                <div id="build-row3" class="build-row"><span class="build-tick">✓</span>Opened the Frame Jam review</div>
              </div>
              <div id="build-box">
                <span id="build-hint">Ask your agent…</span>
                <div id="build-typed"><span class="build-ch build-cmd">/</span><span class="build-ch build-cmd">f</span><span class="build-ch build-cmd">r</span><span class="build-ch build-cmd">a</span><span class="build-ch build-cmd">m</span><span class="build-ch build-cmd">e</span><span class="build-ch build-cmd">j</span><span class="build-ch build-cmd">a</span><span class="build-ch build-cmd">m</span><span class="build-ch">&#160;</span><span class="build-ch">m</span><span class="build-ch">a</span><span class="build-ch">k</span><span class="build-ch">e</span><span class="build-ch">&#160;</span><span class="build-ch">a</span><span class="build-ch">&#160;</span><span class="build-ch">l</span><span class="build-ch">a</span><span class="build-ch">u</span><span class="build-ch">n</span><span class="build-ch">c</span><span class="build-ch">h</span><span class="build-ch">&#160;</span><span class="build-ch">t</span><span class="build-ch">e</span><span class="build-ch">a</span><span class="build-ch">s</span><span class="build-ch">e</span><span class="build-ch">r</span><span class="build-ch">&#160;</span><span class="build-ch">f</span><span class="build-ch">o</span><span class="build-ch">r</span><span class="build-ch">&#160;</span><span class="build-ch">o</span><span class="build-ch">u</span><span class="build-ch">r</span><span class="build-ch">&#160;</span><span class="build-ch">a</span><span class="build-ch">p</span><span class="build-ch">p</span><span id="build-caret"></span></div>
                <span id="build-chip">Agent</span>
                <span id="build-send">↑</span>
              </div>
            </div>
            <div id="build-panel">
              <video id="build-v" class="clip" src="assets/footage/review.mp4" data-start="2.9" data-duration="2.3" data-media-start="4.3" data-track-index="2" muted playsinline></video>
              <img id="build-still" class="clip" src="assets/stills/review-4.3.jpg" data-start="2.9" data-duration="0.2" data-track-index="3" alt="" />
            </div>
          </div>
        </div>
        <div id="build-cap1" class="build-cap clip" data-start="0.05" data-duration="2.75" data-track-index="4"><span class="build-w">Your</span> <span class="build-w build-blue">agent</span> <span class="build-w">makes</span> <span class="build-w">the</span> <span class="build-w">video.</span></div>
        <div id="build-cap2" class="build-cap clip" data-start="2.9" data-duration="1.6" data-track-index="4">Right inside your <span class="build-blue">agent.</span></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // The agent app opens and the prompt types out (0.45 → 1.85), then it sends.
          tl.fromTo("#build-win", { y: 60, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, 0);
          tl.fromTo("#build-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.2, ease: "sine.out" }, 0);
          tl.set("#build-hint", { opacity: 0 }, 0.45);
          tl.to("#build-typed .build-ch", { display: "inline", duration: 0.001, stagger: 0.033 }, 0.45);
          tl.fromTo("#build-caret", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: 7, yoyo: true }, 0.45);
          tl.set("#build-typed", { opacity: 0 }, 1.95);
          tl.set("#build-hint", { opacity: 1 }, 1.95);
          tl.fromTo("#build-send", { scale: 1 }, { scale: 0.82, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 1.9);
          tl.fromTo("#build-ask", { y: 40, scale: 0.95, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 1.95);
          // The agent works: three steps tick in.
          tl.fromTo(["#build-row1", "#build-row2", "#build-row3"], { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.25 }, 2.15);
          // Frame Jam slides in from the side, inside the same app.
          tl.to("#build-chat", { width: 659, duration: 0.6, ease: "power3.out" }, 2.9);
          tl.fromTo("#build-panel", { x: 1060 }, { x: 0, duration: 0.6, ease: "power3.out" }, 2.9);
          // Zoom into the panel; it lands exactly on the next scene's first framing.
          tl.to("#build-stage", { x: -1198.8, y: -578.6, scale: 1.8535, duration: 0.7, ease: "power2.inOut" }, 4.5);
          tl.to("#build-glow", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.5);

          tl.fromTo("#build-cap1", { xPercent: -50, scale: 1.3, opacity: 0 }, { xPercent: -50, scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.05);
          tl.fromTo("#build-cap1 .build-w", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out", stagger: 0.06 }, 0.1);
          tl.to("#build-cap1", { opacity: 0, duration: 0.1 }, 2.7);
          tl.fromTo("#build-cap2", { xPercent: -50, scale: 1.3, opacity: 0 }, { xPercent: -50, scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 2.9);
          tl.to("#build-cap2", { opacity: 0, y: -20, duration: 0.18, ease: "power2.in" }, 4.32);
          window.__timelines["build"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
