<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", sans-serif; color: #f4f4f5; }
        #range-bg { position: absolute; inset: 0; background: #0c0c0d; }
        #range-plane { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; border-radius: 14px; overflow: hidden; background: #0c0c0d; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.09), 0 50px 140px rgba(0, 0, 0, 0.65); }
        #range-plane video, #range-plane img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
        .range-cap { position: absolute; left: 96px; top: 92px; padding: 28px 46px 36px; border-radius: 30px; background: rgba(12, 12, 13, 0.94); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.55); font-weight: 700; font-size: 96px; line-height: 1.02; letter-spacing: -0.04em; white-space: nowrap; transform-origin: 0 0; }
        .range-lime { color: #d4ff3a; }
      </style>

      <div id="root" data-composition-id="range" data-width="1920" data-height="1080">
        <div id="range-bg" class="clip" data-start="0" data-duration="3.45" data-track-index="0"></div>
        <div id="range-plane">
          <video id="range-a" class="clip" src="assets/footage/review.mp4" data-start="0" data-duration="1.56" data-media-start="11.28" data-playback-rate="2" data-track-index="1" muted playsinline></video>
          <img id="range-a-still" class="clip" src="assets/stills/review-11.28.jpg" data-start="0" data-duration="0.2" data-track-index="4" alt="" />
          <video id="range-b" class="clip" src="assets/footage/review.mp4" data-start="1.56" data-duration="1.89" data-media-start="14.4" data-playback-rate="2" data-track-index="2" muted playsinline></video>
          <img id="range-b-still" class="clip" src="assets/stills/review-14.4.jpg" data-start="1.56" data-duration="0.2" data-track-index="4" alt="" />
        </div>
        <div id="range-cap" class="range-cap clip" data-start="0.35" data-duration="3.1" data-track-index="3">Drag a <span class="range-lime">range.</span></div>
      </div>

      <script>
        (function () {
          const cam = (px, py, z) => ({ x: 960 - px * z, y: 540 - py * z, scale: z });
          const tl = gsap.timeline({ paused: true });

          // The footage continues from the exact frame the last scene ended on; ease onto the filmstrip before the drag (0.78 → 1.45).
          tl.fromTo("#range-plane", cam(900, 360, 1.3), { ...cam(629, 682, 1.9), duration: 0.7, ease: "power2.inOut" }, 0);
          // Down to the comment box, then hold still while it types (1.8 → 2.92) and lands (3.07).
          tl.to("#range-plane", { ...cam(460, 790, 1.85), duration: 0.5, ease: "power2.inOut" }, 1.5);

          tl.fromTo("#range-cap", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.35);
          tl.to("#range-cap", { opacity: 0, y: -20, duration: 0.15, ease: "power2.in" }, 3.28);
          window.__timelines["range"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
