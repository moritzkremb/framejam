<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
        @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", sans-serif; color: #f4f4f5; }
        #hook-bg { position: absolute; inset: 0; background: #0c0c0d; }
        #hook-cam { position: absolute; inset: 0; }
        #hook-plane { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; border-radius: 14px; overflow: hidden; background: #0c0c0d; }
        #hook-plane video { display: block; width: 100%; height: 100%; }
        #hook-type { position: absolute; left: 150px; top: 290px; width: 1620px; }
        .hook-l { display: block; font-weight: 700; font-size: 132px; line-height: 1.12; letter-spacing: -0.04em; }
        #hook-l2 { color: #a1a1aa; }
        #hook-say { position: relative; display: inline-block; margin-top: 64px; font-family: "Geist Mono", monospace; font-size: 40px; color: #86868f; }
        .hook-c { opacity: 0; }
        #hook-strike { position: absolute; left: -8px; right: -8px; top: 52%; height: 6px; border-radius: 3px; background: #d4ff3a; transform-origin: left center; }
        #hook-glow { position: absolute; left: 980px; top: -380px; width: 1300px; height: 1300px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 255, 58, 0.14), rgba(212, 255, 58, 0) 62%); }
      </style>

      <div data-hf-id="hf-ktv8" id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <div data-hf-id="hf-cg0e" id="hook-bg" class="clip" data-start="0" data-duration="4.5" data-track-index="0"></div>
        <div data-hf-id="hf-5m9y" id="hook-glow" class="clip" data-start="1.7" data-duration="2.8" data-track-index="1"></div>
        <div data-hf-id="hf-7xtu" id="hook-cam">
          <div data-hf-id="hf-n01h" id="hook-plane">
            <video data-hf-id="hf-h0o3" id="hook-v" class="clip" src="assets/footage/review.mp4" data-start="0" data-duration="1.7" data-media-start="2.87" data-track-index="2" muted playsinline></video>
          </div>
        </div>
        <div data-hf-id="hf-ugr7" id="hook-type" class="clip" data-start="1.7" data-duration="2.8" data-track-index="3">
          <span data-hf-id="hf-qodz" class="hook-l" id="hook-l1">Your agent made a video.</span>
          <span data-hf-id="hf-xvgp" class="hook-l" id="hook-l2">Now explain what’s wrong.</span>
          <span data-hf-id="hf-p06p" id="hook-say"></span>
        </div>
      </div>

      <script>
        (function () {
          const say = "“at like 0:03… the yellow bit… make it pop?”";
          const host = document.getElementById("hook-say");
          for (const ch of say) {
            const s = document.createElement("span");
            s.className = "hook-c";
            s.textContent = ch;
            host.appendChild(s);
          }
          const strike = document.createElement("span");
          strike.id = "hook-strike";
          host.appendChild(strike);

          const cam = (px, py, z) => ({ x: 960 - px * z, y: 540 - py * z, scale: z });
          const tl = gsap.timeline({ paused: true });

          // The reviewed video, big in its real player.
          tl.fromTo("#hook-plane", cam(530, 325, 1.92), { ...cam(520, 322, 2.04), duration: 1.7, ease: "none" }, 0);

          // Hard cut to the question.
          tl.fromTo("#hook-l1", { y: 70, opacity: 0, scale: 1.04 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.72);
          tl.fromTo("#hook-l2", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 2.22);
          tl.to(".hook-c", { opacity: 1, duration: 0.01, stagger: 0.022, ease: "none" }, 2.75);
          tl.fromTo("#hook-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.inOut" }, 3.85);
          tl.to("#hook-say", { color: "#5b5b62", duration: 0.25 }, 3.95);
          tl.fromTo("#hook-glow", { scale: 0.85, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.8, ease: "sine.inOut" }, 1.7);
          tl.to("#hook-type", { opacity: 0, y: -24, duration: 0.18, ease: "power2.in" }, 4.32);
          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
