<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", sans-serif; color: #f4f4f5; }
        #grid-bg { position: absolute; inset: 0; background: #0c0c0d; }
        #grid-plane { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; border-radius: 14px; overflow: hidden; background: #0c0c0d; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.09), 0 50px 140px rgba(0, 0, 0, 0.65); }
        #grid-plane video, #grid-plane img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
        .grid-cap { position: absolute; left: 96px; bottom: 92px; padding: 28px 46px 36px; border-radius: 30px; background: rgba(12, 12, 13, 0.94); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.55); font-weight: 700; font-size: 96px; line-height: 1.02; letter-spacing: -0.04em; white-space: nowrap; transform-origin: 0 100%; }
        .grid-lime { color: #d4ff3a; }
      </style>

      <div id="root" data-composition-id="grid" data-width="1920" data-height="1080">
        <div id="grid-bg" class="clip" data-start="0" data-duration="4.3" data-track-index="0"></div>
        <div id="grid-plane">
          <video id="grid-a" class="clip" src="assets/footage/styles3.mp4" data-start="0" data-duration="2.4" data-media-start="0.6" data-playback-rate="2" data-track-index="1" muted playsinline></video>
          <img id="grid-a-still" class="clip" src="assets/stills/styles3-0.6.jpg" data-start="0" data-duration="0.2" data-track-index="4" alt="" />
          <video id="grid-b" class="clip" src="assets/footage/styles3.mp4" data-start="2.4" data-duration="1.9" data-media-start="5.4" data-track-index="2" muted playsinline></video>
          <img id="grid-b-still" class="clip" src="assets/stills/styles3-5.4.jpg" data-start="2.4" data-duration="0.2" data-track-index="4" alt="" />
        </div>
        <div id="grid-cap" class="grid-cap clip" data-start="2.4" data-duration="1.9" data-track-index="3">Press <span class="grid-lime">Use.</span></div>
      </div>

      <script>
        (function () {
          const cam = (px, py, z) => ({ x: 960 - px * z, y: 540 - py * z, scale: z });
          const tl = gsap.timeline({ paused: true });

          // Land wide, dive onto Bauhaus Grid (hover at local 0.21), then down to Doodle Mascot (1.76).
          tl.fromTo("#grid-plane", { ...cam(720, 450, 0.8), opacity: 0 }, { ...cam(601, 400, 1.75), opacity: 1, duration: 0.55, ease: "expo.out" }, 0);
          tl.to("#grid-plane", { ...cam(601, 410, 1.82), duration: 0.85, ease: "none" }, 0.55);
          tl.to("#grid-plane", { ...cam(602, 630, 1.85), duration: 0.45, ease: "power3.inOut" }, 1.4);
          // Same footage, now at 1x: the cursor moves to Doodle's Use button and clicks (local 3.32).
          tl.to("#grid-plane", { ...cam(650, 600, 1.95), duration: 0.7, ease: "power2.inOut" }, 2.45);
          tl.to("#grid-plane", { ...cam(650, 600, 2.07), duration: 0.08, ease: "power2.out" }, 3.32);
          tl.to("#grid-plane", { ...cam(650, 600, 1.95), duration: 0.2, ease: "power2.out" }, 3.4);
          // Out to the toast and the header chip: "Using Doodle Mascot".
          tl.to("#grid-plane", { ...cam(800, 250, 1.3), duration: 0.4, ease: "power3.inOut" }, 3.6);

          tl.fromTo("#grid-cap", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 2.4);
          tl.to("#grid-cap", { opacity: 0, y: 20, duration: 0.12, ease: "power2.in" }, 4.18);
          window.__timelines["grid"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
