<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title>
<style>body{padding:20px} </style></head>
<body>

<div class="fc-col">
  <div class="fc-row">
    <button class="fc-btn primary lg"><svg class="fc-i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> Send 3 to agent</button>
    <button class="fc-btn primary">Use this style</button>
    <button class="fc-btn"><svg class="fc-i sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy prompt</button>
    <button class="fc-btn outline">Open in browser</button>
  </div>
  <div class="fc-row">
    <button class="fc-btn ghost sm"><svg class="fc-i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg> Edit</button>
    
    <button class="fc-btn danger sm"><svg class="fc-i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg> Delete</button>
    <button class="fc-btn ghost icon round" aria-label="More"><svg class="fc-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    <button class="fc-btn primary" disabled>Send to agent</button>
  </div>
</div>
</body>
</html>
