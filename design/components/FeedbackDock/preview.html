  </div>

</div>
<div class="fc-dock" style="position:static;padding:0">

  </div>
  <div class="send"><span class="fc-agent fc-grow"><span class="dot"></span><span class="fc-truncate">Agent not listening · we'll show you what to tell it</span></span><button class="fc-btn primary lg"><svg class="fc-i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> Send 2 to agent</button></div>
