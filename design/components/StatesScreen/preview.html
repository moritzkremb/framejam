<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatesScreen</title>
<style>body{padding:20px} body{padding:0}</style></head>
<body>

<div class="fc-col" style="gap:16px;padding:16px">
  <div class="fc-card fc-col" style="gap:10px">
    <div class="fc-caption">Loading a review</div>
    <div class="fc-skel" style="height:200px;border-radius:14px"></div>
    <div class="fc-skel" style="height:48px"></div>
    <div class="fc-skel" style="height:56px;width:70%"></div>
  </div>
  <div class="fc-card"><div class="fc-empty" style="padding:12px 0">
    <span class="ic"><svg class="fc-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><div class="fc-h3">This review isn't here</div>
    <p>It may have been deleted, or the link is from another computer.</p>
    <button class="fc-btn" style="margin-top:8px">Back to reviews</button></div></div>
  <div class="fc-card"><div class="fc-empty" style="padding:12px 0">
    <span class="ic" style="color:var(--danger);background:var(--danger-soft)"><svg class="fc-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg></span><div class="fc-h3">Frame Jam isn't running</div>
    <p>Start it again in your terminal, and this page reconnects by itself.</p>
    <div class="fc-code" style="margin-top:8px;width:100%;max-width:320px"><code>npx framejam</code><button class="fc-btn ghost icon sm round" aria-label="Copy"><svg class="fc-i sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button></div></div></div>
</div>
</body>
</html>
