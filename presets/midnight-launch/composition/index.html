<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Midnight Launch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0b; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #17131f 0%, #0a0a0b 60%); color: #f2f2f3; font-family: "Inter", sans-serif; }
      .scene { position: absolute; inset: 0; visibility: hidden; }
      .icon { position: absolute; width: 200px; height: 200px; border-radius: 48px; background: linear-gradient(140deg, #ff7a45 0%, #c04bff 55%, #4b6bff 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 30px 120px rgba(192, 75, 255, 0.45); }
      .icon::after { content: ""; position: absolute; left: 62px; top: 62px; width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffffff 0%, rgba(255,255,255,0.75) 35%, rgba(255,255,255,0) 72%); }
      .word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: -0.03em; }
      .card { position: absolute; left: 860px; top: 350px; width: 200px; height: 250px; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
      .card.wide { width: 280px; height: 170px; left: 820px; top: 390px; }
      .play { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -18px 0 0 -12px; border-left: 34px solid rgba(255,255,255,0.92); border-top: 20px solid transparent; border-bottom: 20px solid transparent; }
      .tile { position: absolute; left: 870px; top: 380px; width: 180px; height: 180px; border-radius: 22px; background: #1d1c22; border: 1px solid #2c2b33; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
      .tile i { position: absolute; bottom: 60px; width: 10px; border-radius: 5px; background: #ff7a45; }
      .prompt { position: absolute; left: 480px; top: 560px; width: 960px; height: 170px; border-radius: 26px; background: #151518; border: 1px solid #2a2a31; box-shadow: 0 30px 90px rgba(0,0,0,0.5); }
      .ptext { position: absolute; left: 40px; top: 36px; right: 140px; font-size: 32px; line-height: 1.35; color: #e9e9ec; }
      .ptext span { opacity: 0; }
      .send { position: absolute; right: 30px; bottom: 26px; width: 64px; height: 64px; border-radius: 18px; background: #ff5b3a; }
      .send::after { content: ""; position: absolute; left: 24px; top: 20px; width: 16px; height: 16px; border-left: 5px solid #fff; border-top: 5px solid #fff; transform: rotate(45deg); margin-top: 6px; }
      .ray { position: absolute; left: 1378px; top: 620px; width: 4px; height: 36px; margin: -18px 0 0 -2px; background: #ffb199; border-radius: 2px; transform-origin: 50% 70px; }
      #cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; }
      .muted { color: #8b8b93; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="midnight-launch" data-width="1920" data-height="1080" data-duration="8">
      <div id="s1" class="scene">
        <div class="icon" id="icon1" style="left: 860px; top: 330px"></div>
        <div class="word" id="name1" style="top: 590px; font-size: 84px">Lumen</div>
      </div>

      <div id="s2" class="scene">
        <div id="gImg"></div>
        <div id="gVid"></div>
        <div id="gAud"></div>
        <div class="word" id="w1" style="top: 640px; font-size: 104px">Generate images</div>
        <div class="word" id="w2" style="top: 640px; font-size: 104px">Generate video</div>
        <div class="word" id="w3" style="top: 640px; font-size: 104px">Generate audio</div>
      </div>

      <div id="s3" class="scene">
        <div id="results"></div>
        <div class="prompt" id="prompt">
          <div class="ptext" id="ptext"></div>
          <div class="send" id="send"></div>
        </div>
        <div id="rays"></div>
      </div>

      <div id="s4" class="scene">
        <div class="word" id="live" style="top: 480px; font-size: 92px">Lumen MCP is live</div>
        <div class="icon" id="icon2" style="left: 700px; top: 400px; width: 150px; height: 150px; border-radius: 36px"></div>
        <div class="word" id="name2" style="top: 418px; left: 880px; right: auto; text-align: left; font-size: 112px">Lumen</div>
        <div class="word muted" id="url" style="top: 640px; font-size: 34px; font-weight: 500; letter-spacing: 0">One server for images, video and audio · lumen.so/mcp</div>
      </div>

      <svg id="cursor" viewBox="0 0 44 44"><path d="M8 4 L8 36 L16 28 L22 41 L28 38 L22 26 L33 26 Z" fill="#ffffff" stroke="#0a0a0b" stroke-width="2.5" stroke-linejoin="round" /></svg>
    </div>

    <script>
      var arts = [
        "linear-gradient(#1b2a6b, #ff8a5c 70%, #3a2a4a 70%)",
        "radial-gradient(circle at 70% 30%, #ffd27a 0 14%, transparent 15%), linear-gradient(#2e5bff, #9ad0ff 60%, #2d6b3f 60%)",
        "linear-gradient(160deg, #0f3b3a, #3fb39a 55%, #f3e6c4)",
        "radial-gradient(circle at 30% 70%, #ff5b3a 0 20%, transparent 21%), linear-gradient(#26203a, #6b3fa0)",
        "linear-gradient(#f6c9a0, #e0607e 50%, #2b1c3a 50%)",
        "linear-gradient(200deg, #0b0b0b, #3a3a46 50%, #c8c8d0)"
      ];
      var spots = [
        { x: -560, y: -60, r: -14 }, { x: -330, y: -150, r: -7 }, { x: -110, y: -200, r: -2 },
        { x: 110, y: -200, r: 3 }, { x: 330, y: -150, r: 8 }, { x: 560, y: -60, r: 14 }
      ];
      function group(id, cls, html) {
        var g = document.getElementById(id);
        spots.forEach(function (s, i) {
          var c = document.createElement("div");
          c.className = cls;
          if (cls.indexOf("card") === 0) c.style.background = arts[(i + (cls === "card wide" ? 2 : 0)) % arts.length];
          c.innerHTML = typeof html === "function" ? html(i) : html;
          g.appendChild(c);
        });
      }
      group("gImg", "card", "");
      group("gVid", "card wide", '<div class="play"></div>');
      group("gAud", "tile", function (i) {
        var h = "";
        for (var k = 0; k < 9; k++) h += '<i style="left:' + (30 + k * 14) + 'px;height:' + (12 + Math.round(50 * Math.abs(Math.sin((k + i) * 1.3)))) + 'px"></i>';
        return h;
      });
      var res = document.getElementById("results");
      [0, 1, 2].forEach(function (i) {
        var c = document.createElement("div");
        c.className = "card res";
        c.style.background = ["linear-gradient(#1b2a6b, #ff8a5c 62%, #2d6b3f 62%)", "linear-gradient(#2a1e4a, #ff7a45 58%, #3b7a3a 58%)", "linear-gradient(#0f2a5a, #f6b26b 66%, #24573a 66%)"][i];
        c.style.left = 600 + i * 260 + "px";
        c.style.top = "200px";
        c.style.width = "200px";
        c.style.height = "250px";
        res.appendChild(c);
      });
      var PROMPT = "Make a poster of a lone cyclist on a green hill at dusk";
      var pt = document.getElementById("ptext");
      PROMPT.split("").forEach(function (ch) {
        var s = document.createElement("span");
        s.textContent = ch;
        pt.appendChild(s);
      });
      var rays = document.getElementById("rays");
      for (var r = 0; r < 8; r++) {
        var ray = document.createElement("div");
        ray.className = "ray";
        ray.style.transform = "rotate(" + r * 45 + "deg)";
        rays.appendChild(ray);
      }

      var tl = gsap.timeline({ paused: true });
      function show(id, from, to) {
        tl.set(id, { visibility: "visible" }, from);
        if (to !== undefined) tl.set(id, { visibility: "hidden" }, to);
      }
      function blurIn(el, at, d) {
        tl.fromTo(el, { opacity: 0, filter: "blur(18px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: d || 0.6, ease: "power3.out", immediateRender: false }, at);
      }
      function blurOut(el, at) {
        tl.to(el, { opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power2.in" }, at);
      }

      show("#s1", 0, 1.7);
      gsap.set(["#icon1", "#name1"], { opacity: 0 });
      tl.fromTo("#icon1", { scale: 0.6, filter: "blur(24px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, 0.1);
      blurIn("#name1", 0.55, 0.7);
      tl.to(["#icon1", "#name1"], { opacity: 0, scale: 0.94, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 1.4);

      show("#s2", 1.7, 4.6);
      gsap.set(["#w1", "#w2", "#w3"], { opacity: 0 });
      gsap.set(".card:not(.res), .tile", { opacity: 0 });
      tl.fromTo("#gImg > div", { x: 0, y: 40, rotation: 0, scale: 0.4, opacity: 0 }, { x: function (i) { return spots[i].x; }, y: function (i) { return spots[i].y; }, rotation: function (i) { return spots[i].r; }, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", stagger: { each: 0.03, from: "center" }, immediateRender: false }, 1.72)
        .to("#gImg > div", { x: 0, y: 0, rotation: 0, scale: 0.5, opacity: 0, duration: 0.2, ease: "power2.in", stagger: { each: 0.015, from: "edges" } }, 2.4)
        .fromTo("#gVid > div", { x: 0, y: 40, rotation: 0, scale: 0.4, opacity: 0 }, { x: function (i) { return spots[i].x; }, y: function (i) { return spots[i].y; }, rotation: function (i) { return spots[i].r; }, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", stagger: { each: 0.03, from: "center" }, immediateRender: false }, 2.68)
        .to("#gVid > div", { x: 0, y: 0, rotation: 0, scale: 0.5, opacity: 0, duration: 0.2, ease: "power2.in", stagger: { each: 0.015, from: "edges" } }, 3.36)
        .fromTo("#gAud > div", { x: 0, y: 40, rotation: 0, scale: 0.4, opacity: 0 }, { x: function (i) { return spots[i].x; }, y: function (i) { return spots[i].y; }, rotation: function (i) { return spots[i].r; }, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", stagger: { each: 0.03, from: "center" }, immediateRender: false }, 3.64)
        .to("#gAud > div", { x: 0, y: 0, rotation: 0, scale: 0.5, opacity: 0, duration: 0.2, ease: "power2.in", stagger: { each: 0.015, from: "edges" } }, 4.3);
      blurIn("#w1", 1.77);
      blurOut("#w1", 2.4);
      blurIn("#w2", 2.73);
      blurOut("#w2", 3.36);
      blurIn("#w3", 3.69);
      blurOut("#w3", 4.3);

      show("#s3", 4.5, 6.5);
      tl.from("#prompt", { y: 60, opacity: 0, duration: 0.5, ease: "expo.out" }, 4.5);
      gsap.utils.toArray("#ptext span").forEach(function (s, i) {
        tl.set(s, { opacity: 1 }, 4.7 + i * 0.016);
      });
      gsap.set(".ray", { opacity: 0 });
      gsap.set("#cursor", { x: 1600, y: 980, opacity: 0 });
      tl.to("#cursor", { opacity: 1, duration: 0.15 }, 5.3)
        .to("#cursor", { x: 1370, y: 664, duration: 0.45, ease: "power3.inOut" }, 5.35)
        .to("#cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, 5.82)
        .to("#send", { scale: 0.88, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, 5.82)
        .fromTo(".ray", { scaleY: 0, opacity: 1 }, { scaleY: 1, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 5.9)
        .to("#cursor", { opacity: 0, duration: 0.2 }, 6.3);
      gsap.set(".res", { opacity: 0 });
      tl.fromTo(".res", { y: 60, scale: 0.85, opacity: 0, filter: "blur(12px)" }, { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.08, immediateRender: false }, 5.95);

      show("#s4", 6.5);
      gsap.set(["#live", "#icon2", "#name2", "#url"], { opacity: 0 });
      blurIn("#live", 6.5, 0.5);
      blurOut("#live", 7.0);
      tl.fromTo("#icon2", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 7.15);
      blurIn("#name2", 7.22, 0.5);
      blurIn("#url", 7.4, 0.5);

      tl.set({}, {}, 8);
      window.__timelines = window.__timelines || {};
      window.__timelines["midnight-launch"] = tl;
    </script>
  </body>
</html>
