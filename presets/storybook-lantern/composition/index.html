<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Storybook Lantern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #2b2552; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #2b2552; font-family: "Patrick Hand", cursive; }
      .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; opacity: 0; }
      .cam { position: absolute; inset: 0; }
      .layer { position: absolute; left: 0; top: 0; }
      .layer svg { display: block; }
      .rough { filter: url(#rough); }
      #paper { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
      #vig { position: absolute; inset: 0; pointer-events: none; z-index: 21;
        background: radial-gradient(ellipse at 50% 50%, rgba(40, 20, 50, 0) 55%, rgba(40, 20, 50, 0.38) 100%); }
      #cap { position: absolute; left: 0; right: 0; top: 118px; text-align: center; z-index: 10; font-family: "Kalam", cursive; font-weight: 700;
        font-size: 92px; color: #fff3d9; text-shadow: 0 4px 0 rgba(74, 44, 100, 0.55); white-space: nowrap; clip-path: inset(0 100% 0 0); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="storybook-lantern" data-width="1920" data-height="1080" data-duration="9">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="4" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2452" /><stop offset="1" stop-color="#3d3170" /></linearGradient>
          <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15143c" /><stop offset="1" stop-color="#3e3277" /></linearGradient>
          <linearGradient id="gSkyC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98fc4" /><stop offset=".45" stop-color="#e9a7a6" /><stop offset=".8" stop-color="#f6cfa4" /><stop offset="1" stop-color="#fbe2b8" /></linearGradient>
          <linearGradient id="gSkyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1546" /><stop offset=".5" stop-color="#43337c" /><stop offset=".8" stop-color="#9e5a90" /><stop offset="1" stop-color="#e59a86" /></linearGradient>
          <linearGradient id="gSkyE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f4388" /><stop offset=".38" stop-color="#b86890" /><stop offset=".7" stop-color="#ee9d7c" /><stop offset="1" stop-color="#f8cf90" /></linearGradient>
          <radialGradient id="rgY"><stop offset="0" stop-color="#ffd678" stop-opacity=".75" /><stop offset=".4" stop-color="#ffd678" stop-opacity=".26" /><stop offset="1" stop-color="#ffd678" stop-opacity="0" /></radialGradient>
          <radialGradient id="rgW"><stop offset="0" stop-color="#d6faee" stop-opacity=".6" /><stop offset=".45" stop-color="#d6faee" stop-opacity=".2" /><stop offset="1" stop-color="#d6faee" stop-opacity="0" /></radialGradient>
          <radialGradient id="rgS"><stop offset="0" stop-color="#fff1c6" stop-opacity=".95" /><stop offset=".3" stop-color="#ffd9a0" stop-opacity=".4" /><stop offset="1" stop-color="#ffd9a0" stop-opacity="0" /></radialGradient>
          <filter id="pn" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" />
            <feColorMatrix values="0 0 0 0 0.26  0 0 0 0 0.17  0 0 0 0 0.22  1.5 0 0 0 -0.62" />
          </filter>
          <filter id="pm" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="3" seed="11" />
            <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.25  1.1 0 0 0 -0.42" />
          </filter>
        </defs>
      </svg>

      <!-- Scene A: late night at the desk -->
      <div id="sA" class="scene"><div class="cam" id="camA">
        <div class="layer" id="aBg"><svg class="rough" width="2000" height="1080" viewBox="0 0 2000 1080"> <rect width="2000" height="1080" fill="url(#gWall)" /><rect y="885" width="2000" height="200" fill="#1c1738" /><rect y="880" width="2000" height="8" fill="#14102b" /> <path d="M1290 140 L1290 600 L1790 600 L1790 140 Z" fill="#c4b194" /><rect x="1306" y="156" width="468" height="428" fill="url(#gWin)" /> <path d="M1540 156 V584 M1306 370 H1774" stroke="#c4b194" stroke-width="12" /> <path d="M1306 584 L1306 500 Q1360 470 1420 500 L1440 584Z M1580 584 V470 L1620 470 V584Z M1660 584 V510 Q1700 490 1740 510 V584Z" fill="#241f4d" /> <rect x="1640" y="528" width="10" height="12" fill="#f6c75a" opacity=".6" /><rect x="1690" y="540" width="10" height="12" fill="#f6c75a" opacity=".5" /> <circle id="aStarG" cx="1590" cy="260" r="80" fill="url(#rgY)" opacity=".55" /><path id="aStar" d="M1590 236 L1598 254 L1618 256 L1603 269 L1608 289 L1590 278 L1572 289 L1577 269 L1562 256 L1582 254Z" fill="#ffe7a1" /> <path d="M1250 120 Q1290 300 1262 640 L1210 640 Q1190 340 1210 120Z M1830 120 Q1800 300 1830 640 L1890 640 Q1900 340 1870 120Z" fill="#5a3f7e" /> <rect x="1270" y="600" width="540" height="22" rx="4" fill="#6a557c" /> <rect x="130" y="330" width="380" height="14" rx="3" fill="#5b4474" /><rect x="130" y="520" width="380" height="14" rx="3" fill="#5b4474" /> <g id="aBooks"></g> <path d="M300 520 Q290 470 270 450 M300 520 Q320 460 345 440 M300 520 Q300 460 300 420" stroke="#4d8f7f" stroke-width="9" fill="none" stroke-linecap="round" /> <path d="M280 520 H325 L318 560 H287Z" fill="#b4483a" transform="translate(0,-40)" /> </svg></div>
        <div class="layer" id="aFg"><svg class="rough" width="2000" height="1080" viewBox="0 0 2000 1080"> <circle cx="1200" cy="590" r="620" fill="url(#rgW)" /> <rect x="400" y="760" width="34" height="250" fill="#4a3246" /><rect x="1780" y="760" width="34" height="250" fill="#4a3246" /> <rect x="1500" y="760" width="280" height="190" rx="6" fill="#583b4f" /><rect x="1520" y="790" width="240" height="50" rx="4" fill="#6b4a5c" /><rect x="1520" y="860" width="240" height="50" rx="4" fill="#6b4a5c" /> <rect x="1620" y="810" width="40" height="8" rx="4" fill="#e3a23c" /><rect x="1620" y="880" width="40" height="8" rx="4" fill="#e3a23c" /> <rect x="646" y="700" width="22" height="150" rx="10" fill="#8f3a33" /><rect x="650" y="830" width="132" height="22" rx="10" fill="#a8453a" /><rect x="706" y="850" width="14" height="110" fill="#3a2f58" /><path d="M630 972 H800 M650 990 H780" stroke="#3a2f58" stroke-width="12" stroke-linecap="round" /> <g transform="translate(700,830)"><g id="aFig"></g></g> <rect x="360" y="726" width="1500" height="36" rx="6" fill="#6b4a5c" /><rect x="360" y="726" width="1500" height="9" rx="4" fill="#8a6676" /> <ellipse cx="1190" cy="734" rx="470" ry="22" fill="url(#rgW)" /> <rect x="1010" y="456" width="380" height="250" rx="16" fill="#1d1a33" /><rect x="1026" y="472" width="348" height="218" rx="8" fill="#eafcf6" /> <path d="M1060 510 H1230 M1060 546 H1310 M1060 582 H1190 M1060 618 H1280" stroke="#9cc7c0" stroke-width="12" stroke-linecap="round" /> <rect id="aCur" x="1236" y="572" width="12" height="22" fill="#4a8f8e" /> <rect x="1188" y="706" width="24" height="22" fill="#2c2748" /><rect x="1130" y="722" width="140" height="10" rx="5" fill="#2c2748" /> <rect x="790" y="716" width="190" height="12" rx="5" fill="#3c3358" /> <rect x="1440" y="684" width="46" height="44" rx="8" fill="#f4e8d0" /><path d="M1486 696 q18 4 0 24" stroke="#f4e8d0" stroke-width="7" fill="none" /><path d="M1452 670 q-8 -14 0 -26" stroke="#d6faee" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6" /> <rect x="1560" y="700" width="120" height="26" rx="3" fill="#f4e8d0" /><rect x="1572" y="680" width="100" height="22" rx="3" fill="#cfe3d6" transform="rotate(-3 1620 690)" /> <g transform="translate(740,478)"><g id="aCloud"></g></g> <g transform="translate(120,150)"><g id="aTea"></g></g> </svg></div>
      </div></div>

      <!-- Scene B: the single star -->
      <div id="sB" class="scene"><div class="cam" id="camB">
        <div class="layer" id="bBg"><svg class="rough" width="2000" height="1080" viewBox="0 0 2000 1080"> <rect width="2000" height="1080" fill="url(#gWall)" /><rect y="900" width="2000" height="200" fill="#1c1738" /> <path d="M840 80 H1600 V780 H840Z" fill="#c4b194" /><rect x="862" y="102" width="716" height="656" fill="url(#gWin)" /> <path d="M1220 102 V758 M862 440 H1578" stroke="#c4b194" stroke-width="16" /> <circle id="bStarG" cx="1240" cy="290" r="300" fill="url(#rgY)" /> <path d="M1240 290 L1010 440 M1240 290 L1500 190 M1240 290 L1240 120" stroke="#ffe7a1" stroke-width="3" stroke-linecap="round" opacity=".25" /> <path id="bStar" d="M1240 236 L1255 273 L1295 276 L1264 301 L1274 340 L1240 318 L1206 340 L1216 301 L1185 276 L1225 273Z" fill="#ffeab0" /> <path d="M862 758 V620 Q920 580 990 620 L1040 560 Q1080 540 1110 570 L1150 520 Q1190 500 1230 540 V758Z M1260 758 V600 Q1310 560 1350 590 L1400 540 H1450 L1480 600 H1578 V758Z" fill="#241f4d" /> <rect x="1092" y="610" width="12" height="14" fill="#f6c75a" opacity=".6" /><rect x="1300" y="640" width="12" height="14" fill="#f6c75a" opacity=".5" /><rect x="1420" y="620" width="12" height="14" fill="#f6c75a" opacity=".6" /> <rect x="820" y="758" width="800" height="34" rx="6" fill="#6a557c" /> <path d="M790 60 Q840 300 800 760 L720 760 Q690 360 720 60Z M1650 60 Q1610 300 1650 760 L1740 760 Q1760 360 1730 60Z" fill="#5a3f7e" /> </svg></div>
        <div class="layer" id="bFg"><svg class="rough" width="2000" height="1080" viewBox="0 0 2000 1080"> <circle cx="1300" cy="1000" r="560" fill="url(#rgW)" opacity=".35" /> <ellipse cx="590" cy="1030" rx="260" ry="30" fill="#14102b" opacity=".6" /> <g transform="translate(560,1030) scale(1.85)"><g id="bFig"></g></g> <g transform="translate(580,470)"><g id="bCloud"></g></g> <g transform="translate(580,455)"><g id="bBulb"></g></g> <g transform="translate(1000,560) scale(1.35)"><g id="bTea"></g></g> </svg></div>
      </div></div>

      <!-- Scene C: dawn street -->
      <div id="sC" class="scene"><div class="cam" id="camC">
        <div class="layer" id="cSky"><svg class="rough" width="2400" height="1080" viewBox="0 0 2400 1080"> <rect width="2400" height="1080" fill="url(#gSkyC)" /> <circle cx="1300" cy="640" r="520" fill="url(#rgS)" /><circle cx="1300" cy="660" r="70" fill="#fff1cf" /> <g id="cBirds" fill="none" stroke="#6b4f86" stroke-width="5" stroke-linecap="round"><path d="M360 220 q22 -22 44 0 q22 -22 44 0" /><path d="M520 160 q16 -16 32 0 q16 -16 32 0" /><path d="M1300 250 q18 -18 36 0 q18 -18 36 0" /></g> </svg></div>
        <div class="layer" id="cFar"><svg class="rough" width="2400" height="1080" viewBox="0 0 2400 1080"><g id="cFarG"></g></svg></div>
        <div class="layer" id="cMid"><svg class="rough" width="2400" height="1080" viewBox="0 0 2400 1080"><g id="cMidG"></g></svg></div>
        <div class="layer" id="cNear"><svg class="rough" width="2400" height="1080" viewBox="0 0 2400 1080"> <rect y="826" width="2400" height="260" fill="#7c6a90" /><rect y="826" width="2400" height="12" fill="#9a88a8" /> <rect y="930" width="2400" height="160" fill="#5d4c74" /><path d="M0 1006 H2400" stroke="#f4e8d0" stroke-width="8" stroke-dasharray="90 80" opacity=".5" /> <g transform="translate(1500,0)"> <circle cx="150" cy="700" r="260" fill="url(#rgY)" opacity=".7" /> <rect x="20" y="624" width="260" height="214" fill="#e8d7b6" /><rect x="40" y="670" width="220" height="110" rx="6" fill="#f6c75a" /><rect x="40" y="748" width="220" height="40" fill="#8a4a3e" /> <path d="M70 700 q20 -16 30 6 q-6 24 -26 26 M180 700 h50 v34 h-50Z" fill="#fff0c0" opacity=".8" /> <path d="M0 624 H300 L282 560 H18Z" fill="#f4e8d0" /> <path d="M18 560 H70 L60 624 H0Z M120 560 H170 L180 624 H120Z M220 560 H272 L300 624 H240Z" fill="#b4483a" /> <rect x="60" y="506" width="180" height="44" rx="8" fill="#3b2f68" /><text x="150" y="540" text-anchor="middle" font-family="Patrick Hand" font-size="32" fill="#ffe7a1">tea &amp; news</text> <rect x="0" y="838" width="300" height="14" fill="#6b4a5c" /> </g> <g transform="translate(300,0)"><rect x="0" y="420" width="12" height="420" fill="#3b2f68" /><path d="M0 430 q40 -26 80 0" stroke="#3b2f68" stroke-width="10" fill="none" /><circle cx="80" cy="446" r="14" fill="#ffe7a1" /><circle cx="80" cy="446" r="70" fill="url(#rgY)" /></g> <g transform="translate(2000,0)"><rect x="0" y="420" width="12" height="420" fill="#3b2f68" /><path d="M0 430 q40 -26 80 0" stroke="#3b2f68" stroke-width="10" fill="none" /><circle cx="80" cy="446" r="14" fill="#ffe7a1" /><circle cx="80" cy="446" r="70" fill="url(#rgY)" /></g> </svg></div>
        <div class="layer" id="cChars"><svg class="rough" width="1920" height="1080" viewBox="0 0 1920 1080"> <ellipse cx="640" cy="978" rx="130" ry="18" fill="#2c2142" opacity=".4" /> <g transform="translate(640,972) scale(1.6)"><g id="cFig"></g></g> <g transform="translate(900,640) scale(.95)"><g id="cTea"></g></g> </svg></div>
      </div></div>

      <!-- Scene D: rooftop at dusk -->
      <div id="sD" class="scene"><div class="cam" id="camD">
        <div class="layer" id="dSky"><svg class="rough" width="2400" height="1180" viewBox="0 0 2400 1180"> <rect width="2400" height="1180" fill="url(#gSkyD)" /><g id="dStars"></g> <circle cx="1500" cy="880" r="420" fill="url(#rgP)" /> </svg></div>
        <div class="layer" id="dFar"><svg class="rough" width="2400" height="1180" viewBox="0 0 2400 1180"><g id="dFarG"></g></svg></div>
        <div class="layer" id="dMid"><svg class="rough" width="2400" height="1180" viewBox="0 0 2400 1180"><g id="dMidG"></g><g id="dIcons"></g></svg></div>
        <div class="layer" id="dFg"><svg class="rough" width="2400" height="1180" viewBox="0 0 2400 1180"> <rect x="0" y="900" width="1500" height="300" fill="#1a1538" /><rect x="0" y="880" width="1500" height="34" rx="6" fill="#2e2556" /> <rect x="1020" y="700" width="90" height="190" fill="#231c47" /><rect x="1006" y="688" width="118" height="22" rx="5" fill="#2e2556" /> <path d="M1300 880 V720 M1280 760 H1330 M1284 800 H1326" stroke="#2e2556" stroke-width="7" /> <circle cx="520" cy="740" r="360" fill="url(#rgY)" opacity=".5" /> <ellipse cx="520" cy="890" rx="190" ry="18" fill="#0f0b24" opacity=".6" /> <g transform="translate(520,884) scale(1.5)"><g id="dFig"></g></g> <g transform="translate(740,590) scale(1)"><g id="dTea"></g></g> </svg></div>
      </div></div>

      <!-- Scene E: sunset drift -->
      <div id="sE" class="scene"><div class="cam" id="camE">
        <div class="layer" id="eSky"><svg class="rough" width="2400" height="1080" viewBox="0 0 2400 1080"> <rect width="2400" height="1080" fill="url(#gSkyE)" /><circle cx="1620" cy="760" r="620" fill="url(#rgS)" /><circle cx="1620" cy="780" r="92" fill="#fff0c6" /> </svg></div>
        <div class="layer" id="eC1"><svg class="rough" width="3000" height="1080" viewBox="0 0 3000 1080"><g id="eC1G"></g></svg></div>
        <div class="layer" id="eMid"><svg class="rough" width="1920" height="1080" viewBox="0 0 1920 1080"> <g transform="translate(1010,610)"><g id="eFig"></g></g> <g transform="translate(700,470) scale(1.2)"><g id="eTea"></g></g> <g id="eSpark"></g> </svg></div>
        <div class="layer" id="eC2"><svg class="rough" width="3000" height="1080" viewBox="0 0 3000 1080"><g id="eC2G"></g></svg></div>
      </div></div>

      <div id="cap">Small lights still find the way.</div>
      <svg id="paper" width="1920" height="1080" viewBox="0 0 1920 1080">
        <rect width="1920" height="1080" fill="#f6e6c8" opacity=".07" />
        <rect width="1920" height="1080" filter="url(#pm)" opacity=".16" />
        <rect width="1920" height="1080" filter="url(#pn)" opacity=".5" />
      </svg>
      <div id="vig"></div>
    </div>

    <script>
      var NS = "http://www.w3.org/2000/svg";
      function rng(s) { return function () { s |= 0; s = (s + 0x6d2b79f5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function put(id, html) { document.getElementById(id).innerHTML = html; }

      /* ---------- characters ---------- */
      var COAT = "#4a8f8e", COATD = "#2f6b6d", PANT = "#2b2147", SKIN = "#e8b48f", RED = "#b4483a", PURP = "#5b4690";
      function head(p, extra) {
        return '<g id="' + p + '-head"><circle r="33" fill="' + SKIN + '"/><circle cx="32" cy="9" r="5.5" fill="#dca37f"/>' +
          '<path d="M-33 -2 C-40 14 -34 30 -16 26 L-14 6Z" fill="#4a2f3a"/>' +
          '<path d="M-35 -4 C-38 -32 -16 -44 0 -44 C16 -44 38 -32 35 -4 C20 -11 -20 -11 -35 -4Z" fill="' + PURP + '"/>' +
          '<path d="M-35 -4 C-20 -11 20 -11 35 -4 L33 -15 C18 -21 -18 -21 -33 -15Z" fill="' + RED + '"/><circle cx="0" cy="-47" r="11" fill="' + RED + '"/>' +
          '<circle cx="17" cy="4" r="3.8" fill="#4a2a3a"/><circle cx="8" cy="15" r="7" fill="#ee8f94" opacity=".55"/><path d="M19 19 q6 5 11 0" stroke="#4a2a3a" stroke-width="2.6" fill="none" stroke-linecap="round"/>' + (extra || "") + '</g>';
      }
      function walker(p) {
        function leg(id, c) { return '<g transform="translate(-4,-74)"><g id="' + p + '-' + id + '"><rect x="-11" y="-4" width="22" height="76" rx="10" fill="' + c + '"/><path d="M-13 66 L8 66 Q26 70 26 80 L-13 80Z" fill="#7d3a3a"/></g></g>'; }
        function arm(id, c) { return '<g transform="translate(0,-162)"><g id="' + p + '-' + id + '"><rect x="-9" y="-6" width="18" height="68" rx="9" fill="' + c + '"/><circle cy="66" r="10" fill="' + SKIN + '"/></g></g>'; }
        return leg("legB", "#201838") + arm("armB", COATD) +
          '<path d="M-32 -172 Q-48 -110 -50 -60 L50 -60 Q48 -110 32 -172 Q0 -184 -32 -172Z" fill="' + COAT + '"/>' +
          '<path d="M-50 -60 H50 L48 -48 H-48Z" fill="' + COATD + '"/><path d="M0 -168 V-56" stroke="' + COATD + '" stroke-width="4"/>' +
          '<circle cx="12" cy="-130" r="5" fill="#f6c75a"/><circle cx="12" cy="-104" r="5" fill="#f6c75a"/>' +
          '<path d="M-26 -176 Q0 -160 26 -176 L22 -190 Q0 -198 -22 -190Z" fill="' + COATD + '"/>' +
          leg("legF", PANT) + arm("armF", COAT) + '<g transform="translate(5,-208)">' + head(p) + '</g>';
      }
      function sitter(p) {
        return '<path d="M-6 -10 L106 -10 L106 -34 L-6 -34Z" fill="' + PANT + '"/><rect x="82" y="-34" width="26" height="124" rx="12" fill="' + PANT + '"/><path d="M80 84 H122 Q132 88 132 98 H80Z" fill="#7d3a3a"/>' +
          '<path d="M-34 -4 Q-40 -80 -18 -128 Q8 -154 38 -124 Q50 -70 44 -4Z" fill="' + COAT + '"/><path d="M-34 -4 H44 L42 -16 H-33Z" fill="' + COATD + '"/>' +
          '<path d="M16 -112 Q54 -76 98 -104" stroke="' + COATD + '" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 -112 Q54 -76 98 -104" stroke="' + COAT + '" stroke-width="16" fill="none" stroke-linecap="round"/><circle cx="108" cy="-110" r="11" fill="' + SKIN + '"/>' +
          '<g transform="translate(38,-122)"><g id="' + p + '-hd" transform="translate(0,-38)">' + head(p + "s") + '</g></g>';
      }
      function teapot(p, big) {
        return '<g id="' + p + '-b"><circle id="' + p + '-gl" r="' + (big || 170) + '" fill="url(#rgY)"/>' +
          '<path id="' + p + '-st" d="M-4 -50 q-12 -14 0 -28 q12 -14 0 -30" stroke="#fff3cf" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>' +
          '<path d="M-38 -10 q-34 -4 -32 18 q2 20 30 14" stroke="#e3a23c" stroke-width="10" fill="none" stroke-linecap="round"/>' +
          '<g id="' + p + '-sp"><path d="M30 8 Q58 10 60 -20 L72 -36 L82 -26 L70 -12 Q74 26 32 28Z" fill="#f2b94c"/></g>' +
          '<ellipse rx="45" ry="37" fill="#f6c75a"/><ellipse cx="-6" cy="-4" rx="31" ry="23" fill="#ffe7a1" opacity=".9"/>' +
          '<path d="M-26 -30 Q0 -48 26 -30Z" fill="' + RED + '"/><circle cy="-46" r="7" fill="' + RED + '"/>' +
