<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Retro Pop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=DM+Sans:wght@700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #f6e7c8; }
      #stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #f6e7c8; color: #4a2511; font-family: "DM Sans", sans-serif; }
      .clip { position: absolute; inset: 0; visibility: hidden; }
      .sunburst { position: absolute; left: 50%; top: 50%; width: 2200px; height: 2200px; margin: -1100px 0 0 -1100px; border-radius: 50%;
        background: repeating-conic-gradient(#f08a24 0deg 10deg, #f6e7c8 10deg 20deg); opacity: 0.55; }
      .stripes { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(#e2531f 0 25%, #f08a24 25% 50%, #f5b82e 50% 75%, #7a3b16 75% 100%); transform-origin: bottom; }
      .badge { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -400px 0 0 -380px; border-radius: 50%; background: #e2531f; display: grid; place-items: center; text-align: center; box-shadow: 0 16px 0 #7a3b16; }
      .badge h1 { font-family: "Shrikhand", cursive; font-weight: 400; color: #f6e7c8; font-size: 150px; line-height: 0.95; text-shadow: 6px 6px 0 #7a3b16; }
      .badge p { font-size: 46px; color: #f5b82e; margin-top: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
      .big { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: "Shrikhand", cursive; font-size: 340px; line-height: 1; color: #e2531f; text-shadow: 10px 10px 0 #7a3b16; }
      .off { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 72px; text-transform: uppercase; letter-spacing: 0.06em; }
      .ticket { position: absolute; left: 50%; top: 760px; transform: translateX(-50%); width: max-content; background: #4a2511; color: #f5b82e; padding: 20px 40px; border-radius: 16px; font-size: 40px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="retro-pop" data-width="1080" data-height="1080">
      <div class="sunburst" id="sunburst"></div>
      <div class="stripes" id="stripes"></div>

      <div id="scene-badge" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="badge" id="badge">
          <div>
            <h1 id="badge-title">Summer<br />Sale</h1>
            <p id="badge-sub">Groove Records</p>
          </div>
        </div>
      </div>

      <div id="scene-offer" class="clip" data-start="3.2" data-duration="3.8" data-track-index="1">
        <div class="big" id="pct">40%</div>
        <div class="off" id="off">off all vinyl</div>
        <div class="ticket" id="ticket">This weekend · 14 Elm St.</div>
      </div>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true });

      tl.to("#sunburst", { rotation: 60, duration: 7, ease: "none" }, 0)
        .from("#stripes", { scaleY: 0, duration: 0.6, ease: "back.out(2)" }, 0);

      tl.from("#badge", { scale: 0, rotation: -25, duration: 0.9, ease: "elastic.out(1, 0.55)" }, 0.2)
        .from("#badge-title", { y: 40, opacity: 0, duration: 0.5, ease: "back.out(3)" }, 0.6)
        .from("#badge-sub", { opacity: 0, duration: 0.4 }, 0.95)
        .to("#badge", { rotation: 6, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.6)
        .to("#badge", { scale: 0, rotation: 30, duration: 0.4, ease: "back.in(2)" }, 2.8);

      tl.from("#pct", { y: -500, duration: 0.9, ease: "bounce.out" }, 3.2)
        .from("#off", { scale: 0, duration: 0.5, ease: "back.out(3)" }, 3.9)
        .from("#ticket", { y: 80, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 4.3)
        .to("#pct", { scale: 1.06, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 5.0);

      tl.set({}, {}, 7);

      window.__timelines = window.__timelines || {};
      window.__timelines["retro-pop"] = tl;
    </script>
  </body>
</html>
