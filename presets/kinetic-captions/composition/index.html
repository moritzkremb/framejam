<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kinetic Captions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0d0d; }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%); color: #fff; font-family: "Anton", sans-serif; }
      .clip { position: absolute; inset: 0; visibility: hidden; }
      .word { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 230px; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; }
      .hl { color: #111; background: #ffe600; padding: 0 28px; border-radius: 18px; box-decoration-break: clone; }
      .handle { position: absolute; left: 70px; top: 120px; font-family: Inter, sans-serif; font-weight: 800; font-size: 40px; display: flex; align-items: center; gap: 22px; }
      .avatar { width: 84px; height: 84px; border-radius: 50%; background: conic-gradient(#ffe600, #ff3d6e, #ffe600); }
      .progress { position: absolute; left: 70px; right: 70px; bottom: 140px; height: 10px; border-radius: 10px; background: rgba(255,255,255,0.18); overflow: hidden; }
      .progress div { height: 100%; width: 100%; background: #ffe600; transform-origin: left; }
      .sticker { position: absolute; left: 50%; top: 1130px; right: auto; bottom: auto; width: max-content; transform: translateX(-50%) rotate(-4deg); font-family: Inter, sans-serif; font-weight: 800; font-size: 46px; background: #ff3d6e; padding: 18px 34px; border-radius: 20px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="kinetic-captions" data-width="1080" data-height="1920">
      <div class="handle" id="handle"><div class="avatar"></div>@mara.cuts</div>

      <div class="clip word" id="w1" data-start="0.2" data-duration="0.7" data-track-index="1">Stop</div>
      <div class="clip word" id="w2" data-start="0.9" data-duration="0.8" data-track-index="1">scrolling.</div>
      <div class="clip word" id="w3" data-start="1.7" data-duration="0.6" data-track-index="1">This</div>
      <div class="clip word" id="w4" data-start="2.3" data-duration="0.9" data-track-index="1"><span class="hl">one</span></div>
      <div class="clip word" id="w5" data-start="3.2" data-duration="0.7" data-track-index="1">edit</div>
      <div class="clip word" id="w6" data-start="3.9" data-duration="1.1" data-track-index="1">doubled</div>
      <div class="clip word" id="w7" data-start="5" data-duration="2.5" data-track-index="1">my <span class="hl">views</span></div>
      <div class="clip sticker" id="sticker" data-start="5.4" data-duration="2.1" data-track-index="2">Cut the first 2 seconds ✂️</div>

      <div class="progress"><div id="bar"></div></div>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true });

      tl.from("#handle", { y: -30, opacity: 0, duration: 0.4, ease: "power2.out" }, 0)
        .fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 7.5, ease: "none" }, 0);

      var pops = [
        ["#w1", 0.2], ["#w2", 0.9], ["#w3", 1.7], ["#w4", 2.3], ["#w5", 3.2], ["#w6", 3.9], ["#w7", 5.0]
      ];
      pops.forEach(function (p) {
        tl.fromTo(p[0], { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(3)" }, p[1]);
      });
      tl.to("#w4 .hl", { rotation: -3, duration: 0.15, yoyo: true, repeat: 1 }, 2.5)
        .fromTo("#w6", { x: -8 }, { x: 8, duration: 0.05, repeat: 7, yoyo: true, ease: "none" }, 4.1)
        .from("#sticker", { scale: 0, duration: 0.35, ease: "back.out(2.5)" }, 5.4);

      tl.set({}, {}, 7.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["kinetic-captions"] = tl;
    </script>
  </body>
</html>
