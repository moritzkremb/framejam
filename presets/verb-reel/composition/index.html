<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Verb Reel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111111; }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #111111; font-family: "Archivo", sans-serif; font-weight: 900; text-transform: uppercase; }
      .scene { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
      .ican { position: absolute; left: 80px; top: 120px; font-size: 128px; font-stretch: 100%; letter-spacing: -0.01em; line-height: 1; }
      .verb { position: absolute; left: 0; right: 0; text-align: center; line-height: 0.85; white-space: nowrap; }
      .stack { position: absolute; left: 80px; top: 470px; font-size: 230px; line-height: 0.86; color: #efeae0; font-stretch: 88%; letter-spacing: -0.02em; }
      .stack div { transform-origin: left bottom; }
      .ch { display: inline-block; }
      .row { position: absolute; left: -400px; white-space: nowrap; font-size: 210px; font-stretch: 70%; color: #111111; }
      .end { position: absolute; left: 80px; right: 80px; color: #efeae0; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="verb-reel" data-width="1080" data-height="1920" data-duration="7.2">
      <div id="s0" class="scene" style="background: #111111">
        <div class="stack">
          <div id="w1">Watch</div>
          <div id="w2">what</div>
          <div id="w3" style="color: #ff5a1f">I can</div>
          <div id="w4">do<span style="color: #ff5a1f">.</span></div>
        </div>
      </div>

      <div id="s1" class="scene" style="background: #efeae0; color: #111111">
        <div class="ican">I can</div>
        <div class="verb" id="squash" style="top: 1180px; font-size: 220px; font-stretch: 82%; transform-origin: center bottom">Squash</div>
      </div>

      <div id="s2" class="scene" style="background: #ff5a1f; color: #111111">
        <div class="ican">I can</div>
        <div class="verb" id="stretch" style="top: 760px; font-size: 270px; font-stretch: 62%; transform-origin: center bottom">Stretch</div>
      </div>

      <div id="s3" class="scene" style="background: #efeae0; color: #111111">
        <div class="ican">I can</div>
        <div class="verb" id="over" style="top: 700px; font-size: 330px; font-stretch: 80%"><span class="ch oc" style="color: #ff5a1f">O</span><span class="ch oc">v</span><span class="ch oc">e</span><span class="ch oc">r</span></div>
        <div class="verb" id="shoot" style="top: 1010px; font-size: 230px; font-stretch: 80%"><span class="ch sc">S</span><span class="ch sc">h</span><span class="ch sc" style="color: #ff5a1f">o</span><span class="ch sc" style="color: #ff5a1f">o</span><span class="ch sc">t</span></div>
      </div>

      <div id="s4" class="scene" style="background: #111111; color: #ff5a1f">
        <div class="ican" style="color: #efeae0">I can</div>
        <div class="verb" id="blurGhost" style="top: 840px; font-size: 330px; font-stretch: 100%; opacity: 0.25">Blur</div>
        <div class="verb" id="blur" style="top: 840px; font-size: 330px; font-stretch: 100%">Blur</div>
      </div>

      <div id="s5" class="scene" style="background: #ff5a1f; color: #111111">
        <div class="ican">I can</div>
        <div class="row" id="r1" style="top: 560px">Loop • Loop • Loop • Loop • Loop •</div>
        <div class="row" id="r2" style="top: 800px; color: #efeae0">Loop • Loop • Loop • Loop • Loop •</div>
        <div class="row" id="r3" style="top: 1040px">Loop • Loop • Loop • Loop • Loop •</div>
      </div>

      <div id="s6" class="scene" style="background: #3b4cff">
        <div class="end" id="e1" style="top: 640px; font-size: 200px; line-height: 0.88; font-stretch: 85%">Ines<br />Ortega</div>
        <div class="end" id="e2" style="top: 1060px; font-size: 54px; font-weight: 600; font-stretch: 100%; letter-spacing: 0.02em">Motion designer — booking spring 2027</div>
        <div class="end" id="e3" style="top: 1660px; font-size: 48px; font-weight: 700; font-stretch: 100%; text-transform: none">ines.studio</div>
      </div>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true });
      function show(id, from, to) {
        tl.set(id, { visibility: "visible" }, from);
        if (to !== undefined) tl.set(id, { visibility: "hidden" }, to);
      }

      show("#s0", 0, 1.3);
      tl.from(["#w1", "#w2", "#w3", "#w4"], { y: 120, scaleY: 1.6, opacity: 0, duration: 0.35, ease: "expo.out", stagger: 0.12 }, 0.05);

      show("#s1", 1.3, 2.3);
      gsap.set("#squash", { scaleY: 0.22, scaleX: 1.45 });
      tl.to("#squash", { scaleY: 1, scaleX: 1, duration: 0.7, ease: "elastic.out(1, 0.35)" }, 1.35);

      show("#s2", 2.3, 3.3);
      gsap.set("#stretch", { scaleY: 0.25 });
      tl.to("#stretch", { scaleY: 2.15, duration: 0.6, ease: "power4.out" }, 2.32);

      show("#s3", 3.3, 4.3);
      tl.from(".oc", { y: -700, duration: 0.55, ease: "back.out(4)", stagger: 0.05 }, 3.32)
        .from(".sc", { y: 500, rotation: function (i) { return (i % 2 ? 1 : -1) * 18; }, duration: 0.5, ease: "back.out(5)", stagger: 0.05 }, 3.5);

      show("#s4", 4.3, 5.2);
      gsap.set("#blur", { x: 1100, filter: "blur(40px)", skewX: -25 });
      gsap.set("#blurGhost", { x: 1100 });
      tl.to("#blur", { x: 0, filter: "blur(0px)", skewX: 0, duration: 0.5, ease: "expo.out" }, 4.32)
        .to("#blurGhost", { x: -60, duration: 0.6, ease: "expo.out" }, 4.36)
        .to("#blur", { filter: "blur(18px)", x: -40, duration: 0.25, ease: "power2.in" }, 4.95);

      show("#s5", 5.2, 6.1);
      tl.fromTo("#r1", { x: 0 }, { x: -620, duration: 0.9, ease: "none" }, 5.2)
        .fromTo("#r2", { x: -620 }, { x: 0, duration: 0.9, ease: "none" }, 5.2)
        .fromTo("#r3", { x: 0 }, { x: -620, duration: 0.9, ease: "none" }, 5.2);

      show("#s6", 6.1);
      tl.from("#e1", { y: 140, opacity: 0, duration: 0.45, ease: "expo.out" }, 6.12)
        .from("#e2", { y: 40, opacity: 0, duration: 0.35, ease: "power3.out" }, 6.35)
        .from("#e3", { opacity: 0, duration: 0.3, ease: "power2.out" }, 6.55);

      tl.set({}, {}, 7.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["verb-reel"] = tl;
    </script>
  </body>
</html>
