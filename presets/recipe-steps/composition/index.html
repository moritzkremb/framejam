<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Recipe Steps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Patrick+Hand&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbf6ec; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fbf6ec; color: #3b2f2f; font-family: "Patrick Hand", cursive; }
      .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.5; background-image: radial-gradient(rgba(59,47,47,0.07) 1px, transparent 1.3px); background-size: 9px 9px; }
      .title { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 120px; line-height: 1; color: #e5484d; -webkit-text-stroke: 9px #3b2f2f; paint-order: stroke fill; text-shadow: 6px 6px 0 #f6c3c4; letter-spacing: 0.02em; white-space: nowrap; }
      .tl { display: inline-block; }
      .sub { position: absolute; left: 0; right: 0; top: 178px; text-align: center; font-size: 40px; color: #6b5d55; }
      #art { position: absolute; left: 0; top: 0; overflow: visible; }
      .ink { fill: none; stroke: #3b2f2f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .tick { font-family: "Patrick Hand", cursive; font-size: 30px; fill: #9b8f86; }
      .card { position: absolute; left: 1150px; top: 340px; width: 600px; height: 340px; background: #fffdf8; border: 5px solid #3b2f2f; border-radius: 26px; box-shadow: 12px 12px 0 #f6c3c4; }
      .cc { position: absolute; inset: 0; padding: 34px 44px; opacity: 0; }
      .cc .st { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.08em; color: #e5484d; }
      .cc .q { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 104px; line-height: 0.95; margin-top: 4px; color: #e5484d; -webkit-text-stroke: 7px #3b2f2f; paint-order: stroke fill; white-space: nowrap; }
      .cc .n { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 50px; line-height: 1; margin-top: 4px; white-space: nowrap; }
      .cc .nt { font-size: 30px; color: #6b5d55; margin-top: 6px; white-space: nowrap; }
      .bar { position: absolute; left: 44px; bottom: 30px; width: 400px; height: 18px; border: 3px solid #3b2f2f; border-radius: 10px; overflow: hidden; background: #fff; }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #e5484d; transform-origin: left center; display: block; }
      .bl { position: absolute; left: 462px; bottom: 22px; font-size: 28px; color: #6b5d55; white-space: nowrap; }
      .dots { position: absolute; left: 0; top: 910px; width: 1920px; height: 140px; }
      .conn { position: absolute; top: 34px; height: 5px; width: 144px; background: #ddd4c8; border-radius: 3px; overflow: hidden; }
      .conn i { position: absolute; inset: 0; background: #e5484d; transform-origin: left center; display: block; }
      .dot { position: absolute; top: 8px; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #c9c0b4; background: #fbf6ec; color: #a89c92; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 30px; line-height: 48px; text-align: center; }
      .dot svg { position: absolute; left: 10px; top: 10px; opacity: 0; }
      .lab { position: absolute; top: 76px; width: 200px; text-align: center; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; color: #a89c92; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="recipe-steps" data-width="1920" data-height="1080" data-duration="8.5">
      <div class="grain"></div>
      <div class="title" id="title"><span class="tl">M</span><span class="tl">A</span><span class="tl">T</span><span class="tl">C</span><span class="tl">H</span><span class="tl">A</span><span class="tl">&nbsp;</span><span class="tl">L</span><span class="tl">A</span><span class="tl">T</span><span class="tl">T</span><span class="tl">E</span></div>
      <div class="sub" id="sub">iced · layered · two minutes</div>

      <svg id="art" width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs><clipPath id="inside"><path d="M592 372 L928 372 L903 832 Q901 846 887 846 L633 846 Q619 846 617 832 Z" /></clipPath></defs>
        <g id="glassG">
          <path d="M580 360 L940 360 L912 840 Q910 858 892 858 L628 858 Q610 858 608 840 Z" fill="#e3f1f1" />
          <rect id="milkStream" x="715" y="318" width="16" height="540" rx="8" fill="#fffdf8" stroke="#3b2f2f" stroke-width="3" />
          <rect id="greenStream" x="715" y="318" width="16" height="540" rx="8" fill="#86b552" stroke="#3b2f2f" stroke-width="3" />
          <g clip-path="url(#inside)">
            <g id="Lmatcha"><path class="wv" fill="#86b552" stroke="#3b2f2f" stroke-width="3" /></g>
            <g id="Lmilk"><path class="wv" id="milkPath" fill="#fffdf8" stroke="#3b2f2f" stroke-width="3" /></g>
            <g id="Lhoney"><path class="wv" fill="#f0a93b" stroke="#3b2f2f" stroke-width="3" /></g>
          </g>
          <g id="ice">
            <rect id="ice1" x="-48" y="-48" width="96" height="96" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="4" />
            <rect id="ice2" x="-48" y="-48" width="96" height="96" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="4" />
            <rect id="ice3" x="-48" y="-48" width="96" height="96" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="4" />
            <rect id="ice4" x="-48" y="-48" width="96" height="96" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="4" />
          </g>
          <circle class="drop" cx="0" cy="0" r="11" fill="#f0a93b" stroke="#3b2f2f" stroke-width="3" />
          <circle class="drop" cx="0" cy="0" r="9" fill="#f0a93b" stroke="#3b2f2f" stroke-width="3" />
          <circle class="drop" cx="0" cy="0" r="12" fill="#f0a93b" stroke="#3b2f2f" stroke-width="3" />
          <path class="ink" d="M580 360 L940 360 L912 840 Q910 858 892 858 L628 858 Q610 858 608 840 Z" />
          <path d="M616 410 L634 790" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8" />
          <path d="M890 420 L882 520" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7" />
        </g>
        <g id="ticks">
          <path class="ink" d="M955 742 L985 742 M955 645 L985 645 M955 548 L985 548 M955 450 L985 450" stroke-width="3" stroke-dasharray="none" />
          <text class="tick" id="t2" x="998" y="752">2 oz</text><text class="tick" id="t4" x="998" y="655">4 oz</text>
          <text class="tick" id="t6" x="998" y="558">6 oz</text><text class="tick" id="t8" x="998" y="460">8 oz</text>
        </g>
        <g id="spoon">
          <path class="ink" d="M0 0 L-190 -120" stroke-width="10" />
          <ellipse cx="0" cy="0" rx="46" ry="26" fill="#f0a93b" stroke="#3b2f2f" stroke-width="5" />
        </g>
        <g id="bottle">
          <path d="M-14 0 L14 0 L14 50 Q50 70 50 110 L50 280 Q50 300 30 300 L-30 300 Q-50 300 -50 280 L-50 110 Q-50 70 -14 50 Z" fill="#fffdf8" stroke="#3b2f2f" stroke-width="5" stroke-linejoin="round" />
          <rect x="-40" y="150" width="80" height="100" rx="10" fill="#f6c3c4" stroke="#3b2f2f" stroke-width="4" />
          <text x="0" y="212" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="30" fill="#e5484d">OAT</text>
        </g>
        <g id="jug">
          <rect x="-100" y="0" width="200" height="10" fill="none" />
          <path d="M-18 0 L18 0 L58 44 L58 172 Q58 192 38 192 L-38 192 Q-58 192 -58 172 L-58 44 Z" fill="#fffdf8" stroke="#3b2f2f" stroke-width="5" stroke-linejoin="round" />
          <path d="M-58 96 L58 96 L58 172 Q58 192 38 192 L-38 192 Q-58 192 -58 172 Z" fill="#86b552" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round" />
          <path class="ink" d="M58 70 Q100 90 58 150" stroke-width="7" />
        </g>
        <g id="stir">
          <path class="ink" d="M0 -460 L0 0" stroke-width="9" />
          <circle cx="0" cy="-470" r="14" fill="#e5484d" stroke="#3b2f2f" stroke-width="4" />
          <ellipse cx="0" cy="4" rx="22" ry="12" fill="#c9c0b4" stroke="#3b2f2f" stroke-width="4" />
        </g>
        <g id="rays" class="ink" stroke="#e5484d" stroke-width="7">
          <path class="ray" pathLength="1" d="M520 330 L470 290" /><path class="ray" pathLength="1" d="M500 470 L430 460" />
          <path class="ray" pathLength="1" d="M1000 330 L1050 290" /><path class="ray" pathLength="1" d="M1020 470 L1090 460" />
          <path class="ray" pathLength="1" d="M640 290 L620 230" /><path class="ray" pathLength="1" d="M880 290 L900 230" />
        </g>
      </svg>

      <div class="card" id="card"></div>
      <div class="dots" id="dots"></div>
    </div>

    <script>
      var STEPS = [
        { q: "1 TSP", n: "HONEY", nt: "wildflower · goes in first", bl: "1 / 1 tsp", lab: "HONEY" },
        { q: "FILL", n: "ICE", nt: "four big cubes", bl: "4 / 4", lab: "ICE" },
        { q: "6 OZ", n: "OAT MILK", nt: "ice cold · 180 ml", bl: "6 / 6 oz", lab: "MILK" },
        { q: "2 OZ", n: "MATCHA", nt: "1 tsp whisked in 60 ml hot water", bl: "2 / 2 oz", lab: "MATCHA" },
        { q: "10 SEC", n: "STIR", nt: "swirl until it turns jade", bl: "10 / 10 s", lab: "STIR" }
      ];
      var T = [1.2, 2.2, 3.1, 4.6, 6.0], FIN = 7.0;
      var card = document.getElementById("card"), dots = document.getElementById("dots");
      STEPS.concat([{ st: "ALL DONE!", q: "ENJOY!", n: "1 : 3 MATCHA · MILK", nt: "serves one · ready in two minutes", bl: "5 / 5 steps" }]).forEach(function (s, i) {
        var d = document.createElement("div");
        d.className = "cc"; d.id = "cc" + i;
        d.innerHTML = '<div class="st">' + (s.st || "STEP " + (i + 1) + " OF 5") + '</div><div class="q">' + s.q + '</div><div class="n">' + s.n + '</div><div class="nt">' + s.nt + '</div><div class="bar"><i id="bar' + i + '"></i></div><div class="bl">' + s.bl + "</div>";
        card.appendChild(d);
      });
      STEPS.forEach(function (s, i) {
        var x = 560 + i * 200;
        if (i > 0) dots.insertAdjacentHTML("beforeend", '<div class="conn" style="left:' + (x - 172) + 'px"><i id="cn' + i + '"></i></div>');
        dots.insertAdjacentHTML("beforeend", '<div class="dot" id="d' + i + '" style="left:' + (x - 28) + 'px"><span id="dn' + i + '">' + (i + 1) + '</span><svg id="dk' + i + '" width="28" height="28" viewBox="0 0 28 28"><path d="M5 15 L11 21 L23 7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab" id="lb' + i + '" style="left:' + (x - 100) + 'px">' + s.lab + "</div>");
      });
      var wave = "M-20 0 Q2 -9 25 0 T70 0 T115 0 T160 0 T205 0 T250 0 T295 0 T340 0 T385 0 T430 0 T475 0 T520 0 V600 H-20 Z";
      document.querySelectorAll(".wv").forEach(function (p) { p.setAttribute("d", wave); });

      var tl = gsap.timeline({ paused: true });
      var LV = { honey: 822, milk: 548, matcha: 450 };
      gsap.set(["#Lmatcha", "#Lmilk", "#Lhoney"], { x: 560, y: 870 });
      gsap.set(["#milkStream", "#greenStream"], { attr: { height: 0 } });
      gsap.set("#bottle", { x: 470, y: 120, rotation: 20, opacity: 0, transformOrigin: "50% 0%" });
      gsap.set("#jug", { x: 470, y: 140, rotation: 20, opacity: 0, transformOrigin: "50% 0%" });
      gsap.set("#spoon", { x: 780, y: 300, rotation: -14, opacity: 0, transformOrigin: "100% 100%" });
      gsap.set("#stir", { x: 800, y: -60 });
      gsap.set(".drop", { x: 790, y: 310, opacity: 0 });
      gsap.set(".ray", { strokeDasharray: 1, strokeDashoffset: 1 });
      var ICE = [[680, 782, -12], [800, 786, 14], [740, 694, 6], [850, 700, -20]];
      ICE.forEach(function (p, i) { gsap.set("#ice" + (i + 1), { x: p[0], y: -160, rotation: p[2] * 3 }); });

      tl.fromTo(".wv", { x: 0 }, { x: -90, duration: 0.9, ease: "none", repeat: 9, immediateRender: false }, 0);
      function level(id, y, at, dur) {
        tl.to(id, { y: y, duration: dur, ease: "power1.out" }, at)
          .fromTo(id + " .wv", { rotation: -4 }, { rotation: 0, transformOrigin: "50% 0%", duration: 1.1, ease: "elastic.out(1, 0.3)", immediateRender: false }, at + dur - 0.2);
      }
      function step(i) {
        var at = T[i];
        if (i > 0) {
          tl.to("#cc" + (i - 1), { opacity: 0, y: -14, duration: 0.15, ease: "power1.in" }, at - 0.05)
            .set("#d" + (i - 1), { backgroundColor: "#e5484d", borderColor: "#e5484d" }, at)
            .set("#dn" + (i - 1), { opacity: 0 }, at).set("#dk" + (i - 1), { opacity: 1 }, at)
            .from("#cn" + i, { scaleX: 0, duration: 0.35, ease: "power2.inOut" }, at)
            .fromTo("#card", { scale: 1 }, { scale: 1.03, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, at);
        }
        tl.fromTo("#cc" + i, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, at + 0.08)
          .from("#bar" + i, { scaleX: 0, duration: (i < 4 ? T[i + 1] : FIN) - at - 0.3, ease: "power1.inOut" }, at + 0.15)
          .set("#d" + i, { borderColor: "#e5484d", color: "#e5484d" }, at + 0.1).set("#lb" + i, { color: "#e5484d" }, at + 0.1)
          .fromTo("#d" + i, { scale: 1 }, { scale: 1.25, duration: 0.14, yoyo: true, repeat: 1, ease: "back.out(3)", immediateRender: false }, at + 0.1);
      }

      // intro
      tl.from("#title .tl", { y: 140, scale: 0, opacity: 0, duration: 0.45, ease: "back.out(2.2)", stagger: 0.04 }, 0.05)
        .from("#sub", { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 0.75)
        .from("#glassG", { y: 60, opacity: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.6)
        .from("#ticks", { opacity: 0, x: -20, duration: 0.4, ease: "power2.out" }, 1.0)
        .from("#card", { x: 160, opacity: 0, duration: 0.45, ease: "back.out(1.7)" }, 1.0)
        .from("#dots", { y: 60, opacity: 0, duration: 0.45, ease: "power3.out" }, 1.0);
      STEPS.forEach(function (s, i) { step(i); });

      // 1 honey
      tl.to("#spoon", { opacity: 1, x: 800, y: 330, duration: 0.3, ease: "power2.out" }, 1.2)
        .to("#spoon", { rotation: 22, duration: 0.3, ease: "power2.inOut" }, 1.45)
        .to(".drop", { opacity: 1, duration: 0.01, stagger: 0.12 }, 1.6)
        .to(".drop", { y: 830, duration: 0.38, ease: "power2.in", stagger: 0.12 }, 1.6)
        .to(".drop", { opacity: 0, duration: 0.05, stagger: 0.12 }, 1.97)
        .to("#spoon", { opacity: 0, x: 900, y: 220, duration: 0.25, ease: "power2.in" }, 2.0);
      level("#Lhoney", LV.honey, 1.9, 0.35);

      // 2 ice
      ICE.forEach(function (p, i) {
        tl.to("#ice" + (i + 1), { y: p[1], rotation: p[2], duration: 0.42, ease: "bounce.out" }, 2.3 + i * 0.13);
      });

      // 3 milk
      tl.to("#bottle", { opacity: 1, x: 620, y: 200, duration: 0.1, ease: "power2.out" }, 2.98)
        .to("#bottle", { x: 722, y: 320, rotation: 118, duration: 0.22, ease: "power2.inOut" }, 3.08)
        .to("#milkStream", { attr: { height: 520 }, duration: 0.12, ease: "power2.in" }, 3.28)
        .to("#milkStream", { attr: { y: 838, height: 0 }, duration: 0.18, ease: "power2.in" }, 4.3)
        .to("#bottle", { rotation: 30, x: 560, y: 120, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.32)
        .to("#t6", { fill: "#e5484d", duration: 0.2 }, 4.3);
      level("#Lmilk", LV.milk, 3.32, 0.8);
      ICE.forEach(function (p, i) { tl.to("#ice" + (i + 1), { y: p[1] - (i < 2 ? 190 : 130), duration: 0.8, ease: "power1.out" }, 3.32); });

      // 4 matcha
      tl.set("#Lmatcha", { y: LV.milk + 6 }, 4.5);
      tl.to("#jug", { opacity: 1, x: 620, y: 210, duration: 0.15, ease: "power2.out" }, 4.6)
        .to("#jug", { x: 722, y: 320, rotation: 116, duration: 0.35, ease: "power2.inOut" }, 4.75)
        .to("#greenStream", { attr: { height: 520 }, duration: 0.15, ease: "power2.in" }, 5.05)
        .to("#greenStream", { attr: { y: 838, height: 0 }, duration: 0.15, ease: "power2.in" }, 5.65)
        .to("#jug", { rotation: 20, x: 560, y: 130, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.68)
        .to("#t8", { fill: "#e5484d", duration: 0.2 }, 5.7);
      level("#Lmatcha", LV.matcha, 5.12, 0.55);
      ICE.forEach(function (p, i) { tl.to("#ice" + (i + 1), { y: p[1] - (i < 2 ? 275 : 215), duration: 0.55, ease: "power1.inOut" }, 5.12); });

      // 5 stir
      tl.to("#stir", { y: 800, duration: 0.35, ease: "power3.out" }, 6.05)
        .to("#stir", { x: 700, rotation: -6, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.4)
        .to("#milkPath", { fill: "#bcd690", duration: 0.5, ease: "power1.inOut" }, 6.4)
        .to("#Lmatcha .wv", { fill: "#9cc46a", duration: 0.5 }, 6.4)
        .to("#stir", { y: -60, duration: 0.3, ease: "power2.in" }, 6.75);

      // finish
      tl.to("#cc4", { opacity: 0, y: -14, duration: 0.15 }, FIN - 0.05)
        .set("#d4", { backgroundColor: "#e5484d", borderColor: "#e5484d" }, FIN)
        .set("#dn4", { opacity: 0 }, FIN).set("#dk4", { opacity: 1 }, FIN)
        .fromTo("#cc5", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)", immediateRender: false }, FIN + 0.05)
        .from("#bar5", { scaleX: 0, duration: 0.6, ease: "power2.out" }, FIN + 0.2)
        .fromTo("#card", { rotation: 0 }, { rotation: -2.5, duration: 0.35, ease: "back.out(3)", immediateRender: false }, FIN)
        .to(".ray", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", stagger: 0.05 }, FIN + 0.1)
        .fromTo("#glassG", { y: 0 }, { y: -18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, FIN)
        .fromTo("#title", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, FIN + 0.1)
        .to("#rays", { opacity: 0.35, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, FIN + 0.6);

      tl.set({}, {}, 8.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["recipe-steps"] = tl;
    </script>
  </body>
</html>
