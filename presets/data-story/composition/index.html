<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Data Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1730; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b1730; color: #e8f1ff; font-family: "Space Grotesk", system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; visibility: hidden; }
      .eyebrow { position: absolute; left: 140px; top: 120px; font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase; color: #2ee6c5; }
      .h2 { position: absolute; left: 140px; top: 170px; font-size: 76px; font-weight: 700; letter-spacing: -0.02em; }
      .chart { position: absolute; left: 140px; right: 140px; bottom: 150px; height: 560px; display: flex; align-items: flex-end; gap: 46px; border-bottom: 2px solid #284066; }
      .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
      .bar { width: 100%; border-radius: 12px 12px 0 0; background: #284066; transform-origin: bottom; }
      .bar.hot { background: linear-gradient(180deg, #2ee6c5, #1b9e8a); box-shadow: 0 0 40px rgba(46,230,197,0.35); }
      .val { position: absolute; font-size: 30px; font-weight: 500; color: #9fb4d6; }
      .day { position: absolute; bottom: -54px; font-size: 26px; color: #6f86ad; }
      .grid { position: absolute; left: 140px; right: 140px; height: 1px; background: rgba(159,180,214,0.12); }
      .stat { position: absolute; left: 0; right: 0; top: 260px; text-align: center; font-size: 300px; font-weight: 700; letter-spacing: -0.05em; color: #2ee6c5; line-height: 1; }
      .stat-label { position: absolute; left: 360px; right: 360px; top: 600px; text-align: center; font-size: 46px; line-height: 1.3; color: #c9d7ef; }
      .source { position: absolute; left: 0; right: 0; bottom: 110px; text-align: center; font-size: 22px; color: #6f86ad; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="data-story" data-width="1920" data-height="1080">
      <div id="scene-chart" class="clip" data-start="0" data-duration="4.2" data-track-index="1">
        <div class="eyebrow" id="eyebrow">Week 38 · Studio usage</div>
        <h2 class="h2" id="chart-title">Review rounds per video, by day</h2>
        <div class="grid" style="bottom: 290px"></div>
        <div class="grid" style="bottom: 430px"></div>
        <div class="grid" style="bottom: 570px"></div>
        <div class="chart" id="chart">
          <div class="col"><div class="bar" style="height: 82%"></div><div class="val" style="bottom: calc(82% + 14px)">4.1</div><div class="day">Mon</div></div>
          <div class="col"><div class="bar" style="height: 74%"></div><div class="val" style="bottom: calc(74% + 14px)">3.7</div><div class="day">Tue</div></div>
          <div class="col"><div class="bar" style="height: 60%"></div><div class="val" style="bottom: calc(60% + 14px)">3.0</div><div class="day">Wed</div></div>
          <div class="col"><div class="bar" style="height: 46%"></div><div class="val" style="bottom: calc(46% + 14px)">2.3</div><div class="day">Thu</div></div>
          <div class="col"><div class="bar" style="height: 34%"></div><div class="val" style="bottom: calc(34% + 14px)">1.7</div><div class="day">Fri</div></div>
          <div class="col"><div class="bar hot" id="hot-bar" style="height: 22%"></div><div class="val" id="hot-val" style="bottom: calc(22% + 14px); color: #2ee6c5">1.1</div><div class="day">Sat</div></div>
        </div>
      </div>

      <div id="scene-stat" class="clip" data-start="4.2" data-duration="3.3" data-track-index="1">
        <div class="stat"><span id="counter">0</span>%</div>
        <p class="stat-label" id="stat-label">of videos now ship after a single round of timestamped feedback.</p>
        <p class="source" id="source">Source: internal studio data, Sept 2026 (n = 1,240 videos)</p>
      </div>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      tl.from("#eyebrow", { opacity: 0, x: -20, duration: 0.5 }, 0.1)
        .from("#chart-title", { opacity: 0, y: 24, duration: 0.6 }, 0.25)
        .from("#chart .bar", { scaleY: 0, duration: 0.9, stagger: 0.12, ease: "expo.out" }, 0.7)
        .from("#chart .val", { opacity: 0, y: 12, duration: 0.4, stagger: 0.12 }, 1.1)
        .to("#hot-bar", { scaleX: 1.08, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.7)
        .to("#chart .col:not(:last-child) .bar", { opacity: 0.45, duration: 0.5 }, 2.7)
        .to("#scene-chart > *", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 3.8);

      var counter = { v: 0 };
      tl.to(counter, {
        v: 87, duration: 1.6, ease: "power2.out",
        onUpdate: function () { document.getElementById("counter").textContent = Math.round(counter.v); }
      }, 4.3)
        .from(".stat", { scale: 0.85, opacity: 0, duration: 0.6 }, 4.2)
        .from("#stat-label", { opacity: 0, y: 20, duration: 0.6 }, 5.0)
        .from("#source", { opacity: 0, duration: 0.5 }, 5.6);

      tl.set({}, {}, 7.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["data-story"] = tl;
    </script>
  </body>
</html>
