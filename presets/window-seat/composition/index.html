<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Window Seat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,400;1,500&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #ead6bf; }
      #stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; color: #4a3a32; font-family: "EB Garamond", serif;
        background: linear-gradient(180deg, #ecd9c2 0%, #e6cdb2 70%, #dfc2a6 100%); }
      #train { position: absolute; inset: 0; }
      #win { position: absolute; left: 120px; top: 96px; width: 840px; height: 680px; border-radius: 72px; overflow: hidden; background: #f2c38f; }
      .scene { position: absolute; inset: 0; visibility: hidden; }
      .lay { position: absolute; left: 0; top: 0; overflow: visible; }
      .reg { filter: drop-shadow(3px 2px 0 rgba(226, 108, 74, 0.3)); }
      .regt { filter: drop-shadow(-3px 2px 0 rgba(70, 140, 150, 0.35)); }
      .dots { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.32;
        background-image: radial-gradient(rgba(28, 34, 70, 0.9) 0.9px, transparent 1.5px); background-size: 5px 5px; }
      .speck { position: absolute; left: 0; top: 0; opacity: 0.5; mix-blend-mode: screen; }
      .sheen { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,250,235,0.09) 42%, rgba(255,255,255,0) 54%); }
      #blind { position: absolute; left: 0; right: 0; top: 0; height: 680px; background: repeating-linear-gradient(180deg, #e9d1ad 0 30px, #d9bd96 30px 33px); }
      .frame { position: absolute; left: 106px; top: 82px; width: 868px; height: 708px; border-radius: 86px; border: 16px solid #cdb498;
        box-shadow: 0 0 0 3px #b59c80, inset 0 0 0 3px rgba(80, 50, 30, 0.22), inset 0 10px 24px rgba(60, 40, 30, 0.25); }
      .sill { position: absolute; left: 64px; top: 768px; width: 952px; height: 30px; border-radius: 5px; background: #ecd4ae; box-shadow: 0 16px 0 #cfb08c, 0 30px 26px rgba(90, 60, 40, 0.18); }
      #glass { position: absolute; left: 790px; top: 650px; }
      .cap { position: absolute; left: 0; right: 0; top: 858px; text-align: center; opacity: 0; }
      .ch { font-size: 19px; letter-spacing: 0.34em; text-transform: uppercase; color: #866650; padding-left: 0.34em; }
      .ln { font-style: italic; font-size: 34px; margin-top: 10px; color: #4a3a32; }
      #title { position: absolute; left: 0; right: 0; top: 842px; text-align: center; opacity: 0; }
      #title .nm { font-size: 78px; font-weight: 500; letter-spacing: 0.02em; line-height: 1; color: #3d2f2a; }
      #title .tg { font-style: italic; font-size: 30px; margin-top: 16px; color: #765847; }
      #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="window-seat" data-width="1080" data-height="1080" data-duration="8.5">
      <div id="train">
        <div id="win">
          <div id="sc1" class="scene"></div>
          <div id="sc2" class="scene"></div>
          <div id="sc3" class="scene"></div>
          <div id="sc4" class="scene"></div>
          <div id="sc5" class="scene"></div>
          <div class="dots"></div>
          <svg class="speck" width="840" height="680">
            <filter id="speck"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3" stitchTiles="stitch" />
              <feColorMatrix values="0 0 0 0 0.98  0 0 0 0 0.93  0 0 0 0 0.84  3 0 0 0 -1.75" /></filter>
            <rect width="840" height="680" filter="url(#speck)" />
          </svg>
          <div class="sheen"></div>
          <div id="blind"></div>
        </div>
        <div class="frame"></div>
        <div class="sill"></div>
        <svg id="glass" width="84" height="124" viewBox="0 0 84 124">
          <g id="water"><path d="M10 52 L74 52 L69 118 L15 118 Z" fill="#9cc4c4" fill-opacity="0.55" /><path d="M10 52 L74 52" stroke="#e8f3ef" stroke-width="3" /></g>
          <path d="M6 6 L78 6 L70 120 L14 120 Z" fill="#fff8ec" fill-opacity="0.18" stroke="#f6ecdc" stroke-width="3.5" stroke-linejoin="round" />
          <path d="M16 16 L20 104" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" />
        </svg>
      </div>

      <div class="cap" id="c1"><div class="ch">Chapter one</div><div class="ln">06:10 · the fields wake first</div></div>
      <div class="cap" id="c2"><div class="ch">Chapter two</div><div class="ln">19:40 · into the pines</div></div>
      <div class="cap" id="c3"><div class="ch">Chapter three</div><div class="ln">23:15 · a city, lit and passing</div></div>
      <div class="cap" id="c4"><div class="ch">Chapter four</div><div class="ln">02:30 · rain since the border</div></div>
      <div id="title"><div class="nm">Slowtrain</div><div class="tg">sleep stories for the long way home</div></div>

      <svg id="grain" width="1080" height="1080">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" />
          <feColorMatrix values="0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0 0.12  2.2 0 0 0 -0.75" /></filter>
        <rect width="1080" height="1080" filter="url(#noise)" />
      </svg>
    </div>

    <script>
      var NS = "http://www.w3.org/2000/svg";
      function prng(s) { return function () { s |= 0; s = (s + 0x6d2b79f5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      var R = prng(14);
      function rr(a, b) { return a + (b - a) * R(); }
      function el(p, tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
      function layer(sc, w, cls, id) { var s = el(document.getElementById(sc), "svg", { width: w, height: 680, viewBox: "0 0 " + w + " 680", class: "lay " + (cls || "") }); if (id) s.id = id; return s; }
      function sky(sc, stops) { var s = layer(sc, 840), g = el(el(s, "defs", {}), "linearGradient", { id: sc + "g", x1: 0, y1: 0, x2: 0, y2: 1 });
        stops.forEach(function (c, i) { el(g, "stop", { offset: i / (stops.length - 1), "stop-color": c }); }); el(s, "rect", { width: 840, height: 680, fill: "url(#" + sc + "g)" }); return s; }
      function tri(t) { t -= Math.floor(t); return 1 - Math.abs(t * 2 - 1); }
      function ridge(w, base, amp, f, ph) { var d = "M0 680 L0 " + base;
        for (var x = 0; x <= w; x += 8) d += " L" + x + " " + (base - amp * (0.25 + 0.55 * tri(x * f + ph) + 0.2 * tri(x * f * 2.3 + ph * 2))).toFixed(1);
        return d + " L" + w + " 680 Z"; }
      function conifer(x, base, h, w) { var n = 5, L = [], Rt = [];
        for (var i = 1; i <= n; i++) { var y = base - h + (h * 0.88 * i) / n, hw = (w / 2) * (0.35 + 0.65 * i / n);
          L.push((x - hw) + " " + y, (x - hw * 0.4) + " " + (y - h * 0.05)); Rt.unshift((x + hw * 0.4) + " " + (y - h * 0.05), (x + hw) + " " + y); }
        L.pop(); Rt.shift(); return "M" + x + " " + (base - h) + " L" + L.join(" L") + " L" + (x - 5) + " " + base + " L" + (x + 5) + " " + base + " L" + Rt.join(" L") + " Z"; }
      function trees(s, w, base, hmin, hmax, gap, fill) { var d = ""; for (var x = rr(0, gap); x < w; x += rr(gap * 0.5, gap * 1.3)) { var h = rr(hmin, hmax); d += conifer(x, base + rr(0, 14), h, h * 0.42); }
        el(s, "path", { d: d, fill: fill }); el(s, "rect", { x: 0, y: base + 8, width: w, height: 680, fill: fill }); }

      // 1 · dawn fields + power lines
      sky("sc1", ["#a8a2c6", "#e7a99a", "#f3b07c", "#f08c4c"]);
      el(layer("sc1", 840), "circle", { id: "sun1", cx: 600, cy: 400, r: 56, fill: "#f7a443" });
      el(layer("sc1", 1100, "regt", "m1"), "path", { d: ridge(1100, 405, 70, 0.0024, 0.3), fill: "#9b8fb6" });
      var fl = layer("sc1", 1700, "", "f1"), rows = [400, 416, 436, 462, 496, 540, 598, 680], cols = ["#e8c46b", "#9cb86d", "#efa97c", "#7ea98b", "#d6b158", "#bcc87b"];
      for (var r = 0; r < rows.length - 1; r++) { var ya = rows[r], yb = rows[r + 1], sk = (yb - ya) * 1.3, x = -260;
        while (x < 1900) { var pw = rr(50, 150) * (1 + r * 0.45); el(fl, "path", { d: "M" + x + " " + ya + " L" + (x + pw) + " " + ya + " L" + (x + pw + sk) + " " + yb + " L" + (x + sk) + " " + yb + " Z", fill: cols[Math.floor(R() * cols.length)] });
          if (R() < 0.4) el(fl, "circle", { cx: x + sk, cy: yb - 4 - r * 2, r: 4 + r * 2.4, fill: "#2f5a50" }); x += pw; } }
      var hd = layer("sc1", 2600, "reg", "h1"), hdd = "M0 680 L0 650";
      for (var hx = 0; hx <= 2600; hx += 26) hdd += " Q" + (hx + 13) + " " + rr(612, 636) + " " + (hx + 26) + " " + rr(640, 652);
      el(hd, "path", { d: hdd + " L2600 680 Z", fill: "#264549" });
      var pl = layer("sc1", 2600, "reg", "p1"), px = [-560, 380, 1320, 2260], wires = "";
      px.forEach(function (x, i) { el(pl, "rect", { x: x - 6, y: 120, width: 12, height: 560, fill: "#5b4a7b" }); el(pl, "rect", { x: x - 70, y: 150, width: 140, height: 9, fill: "#5b4a7b" });
        if (i) [-62, 0, 62].forEach(function (o, k) { var a = px[i - 1] + o, b = x + o, y = 150 + (k === 1 ? -26 : 0); wires += "M" + a + " " + y + " Q" + (a + b) / 2 + " " + (y + 90) + " " + b + " " + y + " "; }); });
      el(pl, "path", { d: wires, fill: "none", stroke: "#5b4a7b", "stroke-width": 3 });
      var bl = layer("sc1", 840, "", "birds");
      for (var b = 0; b < 9; b++) el(bl, "path", { d: "M-9 0 Q-4 -6 0 0 Q4 -6 9 0", transform: "translate(" + (470 + rr(0, 160)) + " " + (210 + rr(0, 70)) + ") scale(" + rr(0.7, 1.2) + ")", fill: "none", stroke: "#5b4a7b", "stroke-width": 2.6, "stroke-linecap": "round" });

      // 2 · dusk forest
      sky("sc2", ["#7b78ae", "#c48d9a", "#eea582", "#f4bf86"]);
      el(layer("sc2", 1100, "regt", "m2"), "path", { d: ridge(1100, 470, 80, 0.003, 1.1), fill: "#6e8ea0" });
      trees(layer("sc2", 1600, "", "t2a"), 1600, 520, 90, 170, 46, "#3c4f80");
      trees(layer("sc2", 2600, "reg", "t2b"), 2600, 680, 300, 560, 120, "#1e2b55");

      // 3 · night city + fireworks
      var s3 = sky("sc3", ["#141f48", "#1f2d62", "#2f417d"]);
      for (var st = 0; st < 40; st++) el(s3, "circle", { cx: rr(0, 840), cy: rr(20, 300), r: rr(0.8, 2), fill: "#f3e4c4", opacity: rr(0.3, 0.8) });
      var fw = layer("sc3", 840), bursts = [[260, 150, "#ef6b56"], [600, 118, "#f7b48a"], [440, 230, "#7cc6c0"]];
      bursts.forEach(function (bu, i) { var g = el(fw, "g", { id: "fw" + i, transform: "translate(" + bu[0] + " " + bu[1] + ")" }), d = "";
        for (var a = 0; a < 20; a++) { var t = (a / 20) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t); d += "M" + (c * 26).toFixed(1) + " " + (s * 26).toFixed(1) + " L" + (c * 74).toFixed(1) + " " + (s * 74).toFixed(1) + " ";
          el(g, "circle", { cx: (c * 86).toFixed(1), cy: (s * 86).toFixed(1), r: 3, fill: bu[2] }); }
        el(g, "path", { d: d, stroke: bu[2], "stroke-width": 3.2, "stroke-linecap": "round" }); });
      var fb = layer("sc3", 1200, "regt", "b3a");
      for (var x3 = 0; x3 < 1200; x3 += rr(50, 90)) el(fb, "rect", { x: x3, y: 560 - rr(70, 190), width: rr(50, 90), height: 200, fill: "#28376e" });
      var mb = layer("sc3", 1700, "reg", "b3b");
      for (var x4 = 0; x4 < 1700; ) { var bw = rr(70, 150), bh = rr(120, 300), by = 560 - bh; el(mb, "rect", { x: x4, y: by, width: bw, height: bh, fill: "#131b40" });
        for (var wy = by + 16; wy < 548; wy += 20) for (var wx = x4 + 10; wx < x4 + bw - 14; wx += 17) if (R() < 0.34) {
          el(mb, "rect", { x: wx, y: wy, width: 9, height: 11, fill: "#f3c76c", opacity: rr(0.6, 1) });
          if (R() < 0.25) el(mb, "rect", { x: wx - 4, y: 1120 - wy, width: 18, height: 3, fill: "#f3c76c", opacity: 0.35 }); }
        x4 += bw + rr(4, 18); }
      el(mb, "rect", { x: 0, y: 560, width: 1700, height: 120, fill: "#18234c", "fill-opacity": 0.9 });
      for (var lr = 0; lr < 70; lr++) el(mb, "rect", { x: rr(0, 1700), y: rr(574, 670), width: rr(10, 40), height: 3, fill: "#f3c76c", opacity: rr(0.15, 0.45) });
      var lp = layer("sc3", 2600, "", "l3");
      [300, 1150, 2000].forEach(function (x) { el(lp, "rect", { x: x - 3, y: 330, width: 6, height: 350, fill: "#0f1738" });
        el(lp, "circle", { cx: x, cy: 326, r: 46, fill: "#f7c873", opacity: 0.28 }); el(lp, "circle", { cx: x, cy: 326, r: 12, fill: "#fff0c2" }); });

      // 4 · rain
      sky("sc4", ["#6c8996", "#93a9ad", "#b2c0ba"]);
      el(layer("sc4", 1100, "regt", "m4a"), "path", { d: ridge(1100, 430, 90, 0.0028, 2.2), fill: "#6f8b99" });
      el(layer("sc4", 1500, "", "m4b"), "path", { d: ridge(1500, 500, 60, 0.004, 0.7), fill: "#4c6a7b" });
      el(layer("sc4", 1500, "", "m4c"), "rect", { x: 0, y: 540, width: 1500, height: 140, fill: "#89a19f" });
      var rn = layer("sc4", 1400, "", "rain"), rd = "";
      for (var k = 0; k < 140; k++) { var rx = rr(0, 1400), ry = rr(-760, 680), ln = rr(30, 80); rd += "M" + rx.toFixed(0) + " " + ry.toFixed(0) + " l" + (-ln * 0.35).toFixed(0) + " " + ln.toFixed(0) + " "; }
      el(rn, "path", { d: rd, stroke: "#f1f5f1", "stroke-opacity": 0.55, "stroke-width": 2.2, "stroke-linecap": "round" });
      var dr = layer("sc4", 840, "", "drops");
      for (var q = 0; q < 34; q++) el(dr, "circle", { cx: rr(10, 830), cy: rr(10, 670), r: rr(3, 8), fill: "#ffffff", "fill-opacity": 0.14, stroke: "#f6faf6", "stroke-opacity": 0.6, "stroke-width": 1.6 });

      // 5 · sunrise rays over mountains
      sky("sc5", ["#f6e2ad", "#f8dc96"]);
      var ry5 = layer("sc5", 840, "", "rays"), rays = "";
      for (var w = 0; w < 28; w += 2) { var a1 = (w / 28) * Math.PI * 2, a2 = ((w + 1) / 28) * Math.PI * 2;
        rays += "M420 360 L" + (420 + Math.cos(a1) * 1000).toFixed(0) + " " + (360 + Math.sin(a1) * 1000).toFixed(0) + " L" + (420 + Math.cos(a2) * 1000).toFixed(0) + " " + (360 + Math.sin(a2) * 1000).toFixed(0) + " Z "; }
      el(ry5, "path", { d: rays, fill: "#f2c15e", "fill-opacity": 0.55 });
      el(layer("sc5", 840), "circle", { id: "sun5", cx: 420, cy: 360, r: 88, fill: "#f2a33b" });
      el(layer("sc5", 1100, "regt", "m5a"), "path", { d: ridge(1100, 430, 120, 0.0026, 0.15), fill: "#c4b1d0" });
      el(layer("sc5", 1300, "", "m5b"), "path", { d: ridge(1300, 500, 110, 0.0034, 0.6), fill: "#9a8cbd" });
      el(layer("sc5", 1600, "reg", "m5c"), "path", { d: ridge(1600, 575, 80, 0.0045, 1.4), fill: "#6c6a9f" });
      el(layer("sc5", 2000, "", "m5d"), "path", { d: "M0 620 Q500 596 1000 616 T2000 612 L2000 680 L0 680 Z", fill: "#e2ae86" });

      var tl = gsap.timeline({ paused: true });
      function show(id, from, to) { tl.set(id, { visibility: "visible" }, from); if (to !== undefined) tl.set(id, { visibility: "hidden" }, to); }
      function scroll(ids, dists, from, to) { ids.forEach(function (id, i) { tl.fromTo(id, { x: 0 }, { x: -dists[i], duration: to - from, ease: "none", immediateRender: false }, from); }); }
      function scene(id, from, to) { show(id, from, to); if (from > 0) tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut", immediateRender: false }, from); }
      function cap(id, at, out) { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, at)
        .to(id, { opacity: 0, y: -6, duration: 0.4, ease: "power1.in" }, out); }

      tl.fromTo("#train", { y: 0 }, { y: -3, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 19 }, 0)
        .fromTo("#water", { rotation: -1.5 }, { rotation: 1.5, svgOrigin: "42 52", duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 19 }, 0);
      gsap.set("#water", { svgOrigin: "42 52" });
      tl.fromTo("#blind", { yPercent: 0 }, { yPercent: -100, duration: 1.0, ease: "power2.inOut" }, 0.05);

      scene("#sc1", 0, 2.6);
      scroll(["#m1", "#f1", "#h1", "#p1"], [90, 520, 1300, 1300], 0, 2.6);
      tl.fromTo("#sun1", { y: 30 }, { y: -20, duration: 2.6, ease: "sine.out", immediateRender: false }, 0)
        .fromTo("#birds", { x: 0, y: 0 }, { x: -160, y: -40, duration: 2.6, ease: "none", immediateRender: false }, 0);
      cap("#c1", 0.5, 1.95);

      scene("#sc2", 2.1, 3.6);
      scroll(["#m2", "#t2a", "#t2b"], [80, 520, 1500], 2.1, 3.6);
      cap("#c2", 2.3, 3.05);

      scene("#sc3", 3.0, 5.7);
      scroll(["#b3a", "#b3b", "#l3"], [180, 640, 1500], 3.0, 5.7);
      [3.25, 4.05, 4.75].forEach(function (t, i) { tl.fromTo("#fw" + i, { scale: 0.15, opacity: 1 }, { scale: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, t)
        .to("#fw" + i, { opacity: 0, y: "+=14", duration: 0.6, ease: "power1.in" }, t + 0.55); });
      gsap.set(["#fw0", "#fw1", "#fw2"], { opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#rays", { svgOrigin: "420 360" });
      cap("#c3", 3.2, 5.0);

      scene("#sc4", 5.3, 7.0);
      scroll(["#m4a", "#m4b", "#m4c"], [70, 300, 300], 5.3, 7.0);
      tl.fromTo("#rain", { x: 0, y: 0 }, { x: -260, y: 700, duration: 1.7, ease: "none", immediateRender: false }, 5.3)
        .fromTo("#drops", { y: 0 }, { y: 30, duration: 1.7, ease: "power1.in", immediateRender: false }, 5.3);
      cap("#c4", 5.5, 6.45);

      scene("#sc5", 6.5);
      scroll(["#m5a", "#m5b", "#m5c", "#m5d"], [40, 120, 260, 400], 6.5, 8.5);
      tl.fromTo("#sun5", { y: 70 }, { y: 0, duration: 2.0, ease: "sine.out", immediateRender: false }, 6.5)
        .fromTo("#rays", { rotation: 0, opacity: 0 }, { rotation: 10, opacity: 1, svgOrigin: "420 360", duration: 2.0, ease: "sine.out", immediateRender: false }, 6.5)
        .fromTo("#title", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 6.9);

      tl.set({}, {}, 8.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["window-seat"] = tl;
    </script>
  </body>
</html>
